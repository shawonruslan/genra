              const type = it.type || it.set ? TYPE_ALIAS[String(it.type || it.set).toUpperCase().replace(/[\s_]/g, '')] : defType;
              const prompt = String(it.prompt || it.description || '').trim();
              if (!type) return problems.push(`#${i + 1}: unknown type "${it.type || it.set}"`);
              if (!prompt) return problems.push(`#${i + 1}: missing prompt`);
              const settings = {};
              if (it.model && TEXT_MODELS.includes(String(it.model))) settings.model = String(it.model);
              if (['1K', '2K'].includes(String(it.res || it.resolution || '').toUpperCase())) settings.res = String(it.res || it.resolution).toUpperCase();
              if (BOOST[String(it.boost || '').toLowerCase()]) settings.boost = String(it.boost).toLowerCase();
              if (DISPLAY[String(it.display || '').toLowerCase()] !== undefined) settings.display = String(it.display).toLowerCase();
              if (STRENGTH[String(it.strength || '').toLowerCase()]) settings.strength = String(it.strength).toLowerCase();
              if (RATIOS[String(it.ratio || '')]) settings.ratio = String(it.ratio);
              if (typeof it.upscale === 'boolean') settings.upscale = it.upscale;
              if (it.sceneVary === 'on' || it.sceneVary === 'off') settings.sceneVary = it.sceneVary;
              if (it.crop === 'center' || it.crop === 'smart') settings.crop = it.crop;
              const concept = String(it.concept || it.name || it.title || '').trim();
              for (let c = 0; c < copies; c++) out.push({ type, prompt, concept: copies > 1 && concept ? `${concept} v${c + 1}` : concept, settings });
            });
            return { out, problems };
          }

          // Start the Gemini-Web worker right away: the session cookie is verified while the first images render,
          // so an expired GEMINI_SESSION is visible in the panel within a minute instead of after the first set.
          if (state.metaWorker.available && state.settings.autoMetadata) setTimeout(() => ensureMetaWorker('session start — verifying Gemini session'), 1500);

          const server = http.createServer(async (req, res) => {
            const url = new URL(req.url, `http://localhost:${PORT}`);
            const p = url.pathname;
            if (p === '/healthz') return json(res, 200, { ok: true, finished: state.finished });
            if (p === '/logo.svg' || p === '/favicon.ico') { res.writeHead(200, { 'Content-Type': 'image/svg+xml', 'Cache-Control': 'public, max-age=86400' }); return res.end(LOGO_SVG); }
            const auth = authed(req, url);
            if (!auth) {
              res.writeHead(401, { 'Content-Type': 'text/html; charset=utf-8' });
              return res.end('<!doctype html><body style="font-family:system-ui;background:#0b0f14;color:#eee;display:grid;place-items:center;height:100vh"><link rel="icon" type="image/svg+xml" href="/logo.svg"><div style="text-align:center"><img src="/logo.svg" alt="" style="width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 14px"><h2>🔒 Image Studio</h2><p>Open the exact link printed in the GitHub Actions log (it contains <code>?k=…</code>).</p></div></body>');
            }
            try {
              if (p === '/' || p === '/index.html') {
                const headers = { 'Content-Type': 'text/html; charset=utf-8', 'Cache-Control': 'no-store' };
                if (auth === 'query') headers['Set-Cookie'] = `sk=${TOKEN}; Path=/; HttpOnly; SameSite=Lax; Max-Age=86400`;
                res.writeHead(200, headers);
                return res.end(PANEL_HTML);
              }
              if (p.startsWith('/files/')) {
                const rel = decodeURIComponent(p.slice(7)).replace(/\.\./g, '');
                const fp = path.join(OUT_DIR, rel);
                if (!fp.startsWith(OUT_DIR) || !fs.existsSync(fp)) { res.writeHead(404); return res.end('not found'); }
                res.writeHead(200, { 'Content-Type': 'image/jpeg', 'Cache-Control': 'private, max-age=3600' });
                return fs.createReadStream(fp).pipe(res);
              }
              if (p === '/api/state') {
                if (url.searchParams.get('v') === String(stateVersion)) return json(res, 200, { unchanged: true, version: stateVersion, now: Date.now() });
                return json(res, 200, { ...publicState(), version: stateVersion }, req);
              }
              if (p === '/api/zip') {
                const zp = buildZip();
                res.writeHead(200, { 'Content-Type': 'application/zip', 'Content-Disposition': 'attachment; filename="zedge_upload.zip"', 'Content-Length': fs.statSync(zp).size });
                return fs.createReadStream(zp).pipe(res);
              }
              if (req.method !== 'POST') return json(res, 404, { error: 'not found' });
              const body = await readBody(req);
              lastActivity = Date.now();

              if (p === '/api/settings') {
                const s = body.settings || {};
                if (s.model && TEXT_MODELS.includes(s.model)) state.settings.model = s.model;
                if (['1K', '2K'].includes(s.res)) state.settings.res = s.res;
                if (RATIOS[s.ratio]) state.settings.ratio = s.ratio;
                if (BOOST[s.boost]) state.settings.boost = s.boost;
                if (DISPLAY[s.display] !== undefined) state.settings.display = s.display;
                if (STRENGTH[s.strength]) state.settings.strength = s.strength;
                if (typeof s.upscale === 'boolean') state.settings.upscale = s.upscale;
                if (s.sceneVary === 'on' || s.sceneVary === 'off') state.settings.sceneVary = s.sceneVary;
                if (s.crop === 'center' || s.crop === 'smart') state.settings.crop = s.crop;
                if (s.concurrency) state.settings.concurrency = Math.max(1, Math.min(4, parseInt(s.concurrency, 10) || 1));
                if (s.targetAccount && (FIREBASE_DB_MAP[s.targetAccount] || s.targetAccount === SPREAD)) state.settings.targetAccount = s.targetAccount;
                if (Array.isArray(s.spreadPool)) { const pool = [...new Set(s.spreadPool.filter(a => FIREBASE_DB_MAP[a]))]; if (pool.length) state.settings.spreadPool = pool; }
                if (typeof s.queuePath === 'string' && /^[A-Za-z0-9_\/-]{1,80}$/.test(s.queuePath.trim())) state.settings.queuePath = s.queuePath.trim();
                if (typeof s.autoDistribute === 'boolean') state.settings.autoDistribute = s.autoDistribute;
                if (typeof s.requireMetadata === 'boolean') state.settings.requireMetadata = s.requireMetadata;
                if (s.metaAutoRetry !== undefined) state.settings.metaAutoRetry = Math.max(0, Math.min(6, parseInt(s.metaAutoRetry, 10) || 0));
