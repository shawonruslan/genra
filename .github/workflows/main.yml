           setMsg(m,\`Queued \${r.added} item(s) · \${r.frames} frame(s)\${r.problems.length?' · skipped: '+r.problems.join('; '):''}\${r.credsOk?'':' — add Cloudinary keys to start'}\`,r.credsOk?'ok':'bad');$('#ptext').value='';$('#ptext').dispatchEvent(new Event('input'));toast(\`Queued \${r.added} item(s)\`,'good');if(!r.credsOk){$$('.tab')[3].click()}}catch(e){setMsg(m,e.message,'bad');toast(e.message,'bad')}finally{$('#addBtn').disabled=false}poll()};
