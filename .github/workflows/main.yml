                out.forEach((o, i) => state.items.push(buildItem(o, startIndex + i + 1)));
                const frames = out.reduce((n, o) => n + SET_FRAMES[o.type].frames.length, 0);
                log(`📥 Added ${out.length} item(s) / ${frames} frame(s)${problems.length ? ` · ${problems.length} skipped` : ''}`);
                saveState(); pump();
                return json(res, 200, { ok: true, added: out.length, frames, problems, credsOk: hasCreds() });
              }
              if (p === '/api/retry') {
                const item = state.items.find(i => i.id === body.id);
                if (!item) throw new Error('item not found');
                if (item.status === 'running') throw new Error('item is still running');
                if (item.distributed.length || item.lockedAccount) throw new Error(`${item.folder} is already in ${item.distributed[0] ? item.distributed[0].dbName : item.lockedAccount} — frames cannot be regenerated after distribution (a new record would duplicate it). Add a new prompt instead.`);
                const which = body.frame;
