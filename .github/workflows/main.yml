                if (state.settings.autoDistribute) state.items.forEach(maybeAutoDistribute);
                if (state.settings.autoMetadata) for (const it of state.items) if (it.status === 'done' && !it.metaStatus) queueMetadata(it, 'generated');
                return json(res, 200, { ok: true, settings: state.settings, creds: { ok: hasCreds() } });
              }
