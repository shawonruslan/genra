name: "🎨 Image Studio - Cloudinary wallpapers + 1:1 foldable companion + Gemini metadata"
run-name: "🎨 Image Studio → ${{ inputs.target_account }} (${{ inputs.image_queue_path }})"

on:
  workflow_dispatch:
    inputs:
      image_queue_path:
        description: "📂 Firebase queue path the records are pushed to"
        required: true
        default: "wallpaperQueue"

      target_account:
        description: "🔥 Default target Firebase DB (Zedge account) - changeable inside the panel"
        required: true
        default: "zedge_2"
        type: choice
        options:
          - zedge_1
          - zedge_2
          - zedge_3
          - zedge_4
          - spread

      gemini_session:
        description: "🌐 Gemini Web Session JSON (paste storageState JSON - optional, falls back to the GEMINI_SESSION secret)"
        required: false
        default: ""

      studio_timeout_minutes:
        description: "⏱️ Max panel session length in minutes (5-330; job hard limit is 360)"
        required: false
        default: "240"

      studio_auto_metadata:
        description: "🧠 Gemini-Web metadata BEFORE distribute (title/tags/category inside every Firebase record) + final pass at the end"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

jobs:
  image-studio:
    name: 🎨 Image Studio → tunnel panel → R2 + Firebase + Gemini metadata
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 📥 Install Dependencies
        run: |
          npm init -y
          npm install node-fetch@3 playwright playwright-extra puppeteer-extra-plugin-stealth
          npx playwright install chromium --with-deps

      - name: 🖥️ Start Virtual Display (Xvfb)
        run: |
          sudo apt-get install -y xvfb ffmpeg
          Xvfb :99 -screen 0 1920x1080x24 &
          sleep 2
          echo "DISPLAY=:99" >> $GITHUB_ENV
          echo "✅ Xvfb virtual display started on :99"

      - name: 📝 Write Gemini-Web metadata script (image_metadata.mjs)
        run: |
          cat > image_metadata.mjs << 'IMGMETA_EOF'
          import fetch from 'node-fetch';
          import fs from 'fs';
          import path from 'path';
          import os from 'os';
          import { execSync } from 'child_process';

          // ─── CONFIG ────────────────────────────────────────────────────────────────
          const GEMINI_SESSION_RAW = (process.env.GEMINI_SESSION_INPUT?.trim() || process.env.GEMINI_SESSION || '').trim();
          const TARGET_ACCOUNT     = 'all_accounts'; // Always scan all DBs automatically
          const IMAGE_QUEUE_PATH   = (process.env.IMAGE_QUEUE_PATH || 'wallpaperQueue').trim();
          // No count cap — we always process ALL images missing metadata automatically.

          // ─── CONTENT KINDS: plain wallpapers, wallpaper sets, and video content ───
          const SET_KINDS = {
            WALLPAPER_24H:     { label: '24H Wallpaper Set',     slots: ['morning', 'afternoon', 'evening', 'night'] },
            WALLPAPER_DUAL:    { label: 'Dual Wallpaper Set',    slots: ['lock', 'home'] },
            WALLPAPER_BATTERY: { label: 'Battery Wallpaper Set', slots: ['critical', 'low', 'mid', 'high', 'full', 'charging'] }
          };
          const VIDEO_KINDS = {
            LIVE_WALLPAPER:     { label: 'Live Wallpaper (video)' },
            CHARGING_ANIMATION: { label: 'Charging Animation (video)' }
          };
          const KIND_PROMPT_CONTEXT = {
            WALLPAPER: `I have attached a phone wallpaper image.`,
            WALLPAPER_24H: `I have attached ONE image from a 24H WALLPAPER SET - 4 wallpapers of the same scene that automatically change through the day (morning, afternoon, evening, night). Write metadata for the WHOLE day-cycle set, not just this single frame.`,
            WALLPAPER_DUAL: `I have attached ONE image from a DUAL WALLPAPER SET - a matching lock screen + home screen wallpaper pair. Write metadata that fits the matching pair.`,
            WALLPAPER_BATTERY: `I have attached ONE image from a BATTERY WALLPAPER SET - artwork that changes with the phone battery level (critical, low, mid, high, full, charging). Write metadata that fits the whole battery pack.`,
            LIVE_WALLPAPER: `I have attached a FRAME extracted from a LIVE WALLPAPER VIDEO (an animated phone wallpaper). Write metadata for the animated live wallpaper.`,
            CHARGING_ANIMATION: `I have attached a FRAME extracted from a phone CHARGING ANIMATION VIDEO (an animation that plays while the phone is charging). Write metadata that fits a charging screen animation.`
          };
          function getRecordKind(record) {
            const ct = String(record.contentType || '').toUpperCase().trim();
            if (SET_KINDS[ct] || VIDEO_KINDS[ct]) return ct;
            if (typeof record.type === 'string' && record.type.startsWith('video/')) return 'LIVE_WALLPAPER';
            return 'WALLPAPER';
          }
          function kindLabel(kind) {
            return (SET_KINDS[kind] || VIDEO_KINDS[kind] || {}).label || 'Wallpaper';
          }
          function slotUrlValue(v) {
            return typeof v === 'string' ? v : ((v && v.fileUrl) || '');
          }
          function firstSlotUrl(record, kind) {
            const meta = SET_KINDS[kind];
            if (!meta || !record.files) return '';
            for (const s of meta.slots) {
              const u = slotUrlValue(record.files[s]);
              if (u) return u;
            }
            return '';
          }

          // ─── PARSE GEMINI SESSION ──────────────────────────────────────────────────
          if (!GEMINI_SESSION_RAW) {
            console.error('❌ Error: GEMINI_SESSION secret or input is missing.');
            process.exit(1);
          }

          // ─── COOKIE NORMALIZER ────────────────────────────────────────────────────
          // Converts browser-extension cookie objects (EditThisCookie, Cookie-Editor, etc.)
          // into Playwright storageState-compatible cookie objects.
          //
          // Key field differences:
          //   expirationDate (float)  → expires (int, -1 = session)
          //   sameSite "no_restriction" → "None"
          //   sameSite null/undefined  → "None"
          //   sameSite "lax"           → "Lax"
          //   sameSite "strict"        → "Strict"
          //   hostOnly, storeId, session → stripped (not used by Playwright)
          function normalizeCookies(rawCookies) {
            return rawCookies.map(c => {
              // sameSite mapping
              let sameSite = 'None';
              if (c.sameSite) {
                const ss = c.sameSite.toLowerCase();
                if (ss === 'lax')                               sameSite = 'Lax';
                else if (ss === 'strict')                       sameSite = 'Strict';
                else if (ss === 'none' || ss === 'no_restriction') sameSite = 'None';
              }
              // expires: Playwright uses integer seconds, -1 means session cookie
              const expires = c.expires   !== undefined ? Math.floor(c.expires) :
                              c.expirationDate !== undefined ? Math.floor(c.expirationDate) :
                              -1;
              return {
                name:     c.name,
                value:    c.value,
                domain:   c.domain,
                path:     c.path || '/',
                expires,
                httpOnly: !!c.httpOnly,
                secure:   !!c.secure,
                sameSite,
              };
            });
          }

          // ─── NORMALIZE SESSION FORMAT ─────────────────────────────────────────────
          // The GEMINI_SESSION may arrive in several formats:
          //   1. Playwright storageState:  { cookies: [...], origins: [...] }
          //   2. Raw cookie array:         [{ name, value, domain, ... }, ...]
          //   3. Wrapped/nested formats:   { cookies: [...], ... } with extra keys
          // We normalize all of them into a valid Playwright storageState object.
          let GEMINI_STORAGE_STATE = null;
          try {
            const parsed = JSON.parse(GEMINI_SESSION_RAW);
            console.log(`📋 Parsed session JSON top-level type: ${Array.isArray(parsed) ? 'array' : typeof parsed}`);
            if (typeof parsed === 'object' && parsed !== null && !Array.isArray(parsed)) {
              console.log(`📋 Top-level keys: ${Object.keys(parsed).slice(0, 10).join(', ')}`);
            }

            // Format 1: Already a Playwright storageState with cookies array
            if (parsed && typeof parsed === 'object' && !Array.isArray(parsed) && Array.isArray(parsed.cookies)) {
              GEMINI_STORAGE_STATE = {
                cookies: normalizeCookies(parsed.cookies),
                origins: Array.isArray(parsed.origins) ? parsed.origins : []
              };
              console.log('🔄 Detected format: Playwright storageState object');

            // Format 2: Raw array of cookie objects (browser extension export)
            } else if (Array.isArray(parsed) && parsed.length > 0 && parsed[0].name !== undefined) {
              GEMINI_STORAGE_STATE = { cookies: normalizeCookies(parsed), origins: [] };
              console.log('🔄 Detected format: Raw cookie array (browser extension) — normalizing fields');

            // Format 3: Object but cookies nested under alternate key
            } else if (parsed && typeof parsed === 'object' && !Array.isArray(parsed)) {
              const altKeys = ['cookie', 'Cookie', 'cookieList', 'cookieJar', 'session'];
              let found = null;
              for (const k of altKeys) {
                if (Array.isArray(parsed[k]) && parsed[k].length > 0) { found = parsed[k]; break; }
              }
              if (!found) {
                for (const val of Object.values(parsed)) {
                  if (val && typeof val === 'object' && Array.isArray(val.cookies) && val.cookies.length > 0) {
                    found = val.cookies;
                    break;
                  }
                }
              }
              if (found) {
                GEMINI_STORAGE_STATE = { cookies: normalizeCookies(found), origins: [] };
                console.log('🔄 Detected format: Nested/alternate key — extracted and normalized cookies');
              }
            }

            if (!GEMINI_STORAGE_STATE || !Array.isArray(GEMINI_STORAGE_STATE.cookies) || GEMINI_STORAGE_STATE.cookies.length === 0) {
              console.error('❌ Error: Could not find any cookies in GEMINI_SESSION JSON.');
              console.error('   Expected one of these formats:');
              console.error('     1. Playwright storageState: {"cookies":[...],"origins":[...]}');
              console.error('     2. Browser extension array: [{"name":"...","value":"...","domain":"..."}]');
              console.error('   Please re-export the session from your browser.');
              process.exit(1);
            }

            const googleCookies = GEMINI_STORAGE_STATE.cookies.filter(c =>
              c.domain && (c.domain.includes('google.com') || c.domain.includes('gemini.google.com'))
            );
            console.log(`🌐 Gemini Web Session loaded: ${GEMINI_STORAGE_STATE.cookies.length} total cookies, ${googleCookies.length} google.com cookies.`);
            // Log key auth cookies to confirm they're present
            const keyNames = ['SID', 'SSID', 'APISID', 'SAPISID', '__Secure-1PSID', '__Secure-3PSID'];
            const foundKeys = GEMINI_STORAGE_STATE.cookies.filter(c => keyNames.includes(c.name)).map(c => c.name);
            console.log(`🔑 Key auth cookies found: ${foundKeys.join(', ') || 'NONE — session may fail!'}`);
            if (googleCookies.length === 0) {
              console.warn('⚠️  Warning: No google.com cookies found — session may not restore correctly.');
            }

          } catch (e) {
            console.error('❌ Error: GEMINI_SESSION is not valid JSON:', e.message);
            process.exit(1);
          }

          // Write storageState to a temp file — passing an object directly to
          // newContext() can silently drop localStorage; writing to disk is reliable.
          const STORAGE_STATE_FILE = path.join(os.tmpdir(), 'gemini_storage_state.json');
          fs.writeFileSync(STORAGE_STATE_FILE, JSON.stringify(GEMINI_STORAGE_STATE, null, 2));
          console.log(`💾 StorageState written to: ${STORAGE_STATE_FILE}`);
          console.log(`   Cookies: ${GEMINI_STORAGE_STATE.cookies.length}, Origins: ${GEMINI_STORAGE_STATE.origins.length}`);

          // ─── FIREBASE DB ROUTING ──────────────────────────────────────────────────
          const FIREBASE_DB_MAP = {
            zedge_1: 'https://zedgeautomation-default-rtdb.firebaseio.com',
            zedge_2: 'https://zedge-automation-2-default-rtdb.asia-southeast1.firebasedatabase.app',
            zedge_3: 'https://zedge-automation-3-default-rtdb.asia-southeast1.firebasedatabase.app',
            zedge_4: 'https://zedge-4-default-rtdb.asia-southeast1.firebasedatabase.app'
          };

          let TARGET_DB_URLS;
          if (TARGET_ACCOUNT === 'all_accounts' || TARGET_ACCOUNT === 'all_four' || TARGET_ACCOUNT === 'all_three') {
            TARGET_DB_URLS = Object.entries(FIREBASE_DB_MAP).map(([name, url]) => ({ name, url }));
          } else if (FIREBASE_DB_MAP[TARGET_ACCOUNT]) {
            TARGET_DB_URLS = [{ name: TARGET_ACCOUNT, url: FIREBASE_DB_MAP[TARGET_ACCOUNT] }];
          } else {
            console.error(`❌ Unknown target_account: "${TARGET_ACCOUNT}".`);
            process.exit(1);
          }

          // ─── UTILITY ──────────────────────────────────────────────────────────────
          function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

          // ─── VALID IMAGE CATEGORIES ────────────────────────────────────────────────
          const VALID_IMG_CATS = [
            'ANIMALS', 'ANIME', 'CARS_N_VEHICLES', 'COMICS', 'DESIGNS',
            'DRAWINGS', 'ENTERTAINMENT', 'FUNNY', 'GAMES', 'HOLIDAYS',
            'LOVE', 'MUSIC', 'NATURE', 'OTHER', 'PATTERNS',
            'PEOPLE', 'SAYINGS', 'SPACE', 'SPIRITUAL', 'SPORTS',
            'TECHNOLOGY'
          ];

          // ─── RESPONSE CLEANERS ─────────────────────────────────────────────────────
          function cleanTitle(raw) {
            if (!raw) return '';
            raw = raw.replace(/^(here is a title:|title:|the title is:|suggested title:)/i, '').trim();
            const quoteMatch = raw.match(/"([^"\r\n]{3,60})"/);
            if (quoteMatch) return quoteMatch[1].trim();
            const boldMatch = raw.match(/\*\*([^\*\r\n]{3,60})\*\*/);
            if (boldMatch) return boldMatch[1].trim();
            const lines = raw.split('\n')
              .map(l => l.trim())
              .filter(l => {
                const lower = l.toLowerCase();
                return l.length > 0 &&
                       !lower.startsWith('here') &&
                       !lower.startsWith('sure') &&
                       !lower.startsWith('based') &&
                       !lower.startsWith('suggest') &&
                       !lower.startsWith('the') &&
                       !lower.startsWith('this');
              });
            if (lines.length > 0) {
              return lines[0].replace(/^["'*\s]+|["'*\s]+$/g, '').trim().slice(0, 30);
            }
            return raw.replace(/^["'*\s]+|["'*\s]+$/g, '').slice(0, 30).trim();
          }

          function cleanKeywords(raw) {
            if (!raw) return '';
            const words = raw.match(/[a-zA-Z0-9]{2,20}/g) || [];
            const stopWords = new Set(['here', 'are', 'the', 'keywords', 'based', 'on', 'this', 'image', 'and', 'for', 'with', 'your', 'wallpaper', 'title', 'tags', 'single', 'word']);
            const uniqueWords = [...new Set(
              words
                .map(w => w.trim())
                .filter(w => {
                  const lower = w.toLowerCase();
                  return w.length > 1 && !stopWords.has(lower);
                })
            )];
            return uniqueWords.slice(0, 10).join(', ');
          }

          function cleanCategory(raw) {
            if (!raw) return 'OTHER';
            const upper = raw.toUpperCase().replace(/[^A-Z0-9_\s]/g, ' ');

            // Alias map: words/phrases Gemini might use → exact Zedge category value
            const ALIAS_MAP = [
              { cat: 'ANIMALS',        aliases: ['ANIMAL', 'ANIMALS', 'WILDLIFE', 'PET', 'PETS', 'BIRD', 'BIRDS', 'CAT', 'DOG'] },
              { cat: 'ANIME',          aliases: ['ANIME', 'MANGA', 'ANIMATION', 'ANIMATED'] },
              { cat: 'CARS_N_VEHICLES',aliases: ['CAR', 'CARS', 'VEHICLE', 'VEHICLES', 'AUTOMOTIVE', 'AUTO', 'TRUCK', 'MOTORCYCLE', 'BIKE', 'TRANSPORT', 'CARS N VEHICLES', 'CARS AND VEHICLES'] },
              { cat: 'COMICS',         aliases: ['COMIC', 'COMICS', 'SUPERHERO', 'CARTOON', 'CARTOONS', 'ILLUSTRATION'] },
              { cat: 'DESIGNS',        aliases: ['DESIGN', 'DESIGNS', 'GRAPHIC', 'ABSTRACT', 'ART', 'ARTISTIC', 'PATTERN ART', 'GEOMETRIC'] },
              { cat: 'DRAWINGS',       aliases: ['DRAWING', 'DRAWINGS', 'SKETCH', 'SKETCHES', 'HAND DRAWN', 'PENCIL', 'INK'] },
              { cat: 'ENTERTAINMENT',  aliases: ['ENTERTAINMENT', 'MOVIE', 'MOVIES', 'FILM', 'TV', 'CELEBRITY', 'CELEBRITIES', 'ACTOR', 'ACTRESS', 'SHOW'] },
              { cat: 'FUNNY',          aliases: ['FUNNY', 'HUMOR', 'HUMOUR', 'MEME', 'MEMES', 'COMEDY', 'JOKE', 'JOKES', 'LOL'] },
              { cat: 'GAMES',          aliases: ['GAME', 'GAMES', 'GAMING', 'VIDEO GAME', 'VIDEOGAME', 'ESPORTS', 'GAMER'] },
              { cat: 'HOLIDAYS',       aliases: ['HOLIDAY', 'HOLIDAYS', 'CHRISTMAS', 'HALLOWEEN', 'EASTER', 'NEW YEAR', 'FESTIVAL', 'CELEBRATION'] },
              { cat: 'LOVE',           aliases: ['LOVE', 'ROMANCE', 'ROMANTIC', 'HEART', 'HEARTS', 'VALENTINES', 'COUPLE', 'WEDDING'] },
              { cat: 'MUSIC',          aliases: ['MUSIC', 'MUSICAL', 'SONG', 'SONGS', 'BAND', 'CONCERT', 'INSTRUMENT', 'DJ'] },
              { cat: 'NATURE',         aliases: ['NATURE', 'NATURAL', 'LANDSCAPE', 'FOREST', 'MOUNTAIN', 'OCEAN', 'FLOWER', 'FLORAL', 'PLANT', 'TREE', 'BEACH', 'SUNSET', 'SKY', 'FOOD', 'TRAVEL', 'CITY', 'ARCHITECTURE', 'SPACE EARTH'] },
              { cat: 'PATTERNS',       aliases: ['PATTERN', 'PATTERNS', 'TEXTURE', 'TEXTURES', 'MINIMALIST', 'MINIMAL', 'RETRO', 'VINTAGE'] },
              { cat: 'PEOPLE',         aliases: ['PEOPLE', 'PERSON', 'PORTRAIT', 'FACE', 'HUMAN', 'MAN', 'WOMAN', 'GIRL', 'BOY'] },
              { cat: 'SAYINGS',        aliases: ['SAYING', 'SAYINGS', 'QUOTE', 'QUOTES', 'MOTIVATIONAL', 'INSPIRATIONAL', 'TEXT', 'TYPOGRAPHY', 'WORDS'] },
              { cat: 'SPACE',          aliases: ['SPACE', 'GALAXY', 'UNIVERSE', 'COSMOS', 'STAR', 'STARS', 'PLANET', 'NEBULA', 'ASTRONAUT', 'SCI FI', 'SCIFI', 'SCIENCE FICTION'] },
              { cat: 'SPIRITUAL',      aliases: ['SPIRITUAL', 'RELIGION', 'RELIGIOUS', 'FAITH', 'GOD', 'MANDALA', 'MEDITATION', 'ZEN', 'BUDDHIST', 'ISLAMIC', 'CHRISTIAN'] },
              { cat: 'SPORTS',         aliases: ['SPORT', 'SPORTS', 'FOOTBALL', 'BASKETBALL', 'SOCCER', 'TENNIS', 'BASEBALL', 'ATHLETICS', 'FITNESS', 'GYM'] },
              { cat: 'TECHNOLOGY',     aliases: ['TECHNOLOGY', 'TECH', 'DIGITAL', 'CYBER', 'NEON', 'FUTURISTIC', 'COMPUTER', 'ROBOT', 'AI', 'CIRCUIT', 'DARK'] },
            ];

            for (const { cat, aliases } of ALIAS_MAP) {
              if (aliases.some(a => upper.includes(a))) return cat;
            }
            return 'OTHER';
          }

          function cleanDescription(raw) {
            if (!raw) return '';
            const quoteMatch = raw.match(/"([^"\r\n]{3,100})"/);
            let text = quoteMatch ? quoteMatch[1] : raw;
            text = text.replace(/^(here is a short description:|description:)/i, '').trim();
            const words = text.split(/\s+/).filter(Boolean);
            return words.slice(0, 5).join(' ');
          }

          // ─── FIREBASE: SCAN FOR IMAGES WITHOUT METADATA ───────────────────────────
          async function scanImagesWithoutMetadata(dbUrl, queuePath) {
            console.log(`  🔍 Scanning ${dbUrl}/${queuePath} for images without metadata...`);
            const res = await fetch(`${dbUrl}/${queuePath}.json`);
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase read failed (${res.status}): ${err.slice(0, 200)}`);
            }
            const data = await res.json();
            if (!data || typeof data !== 'object') {
              console.log('  ℹ️  Queue is empty or not an object — nothing to process.');
              return [];
            }

            let totalRecords = 0, skippedNotImage = 0, skippedHasMetadata = 0, skippedNoData = 0;
            const candidates = [];

            for (const [key, record] of Object.entries(data)) {
              if (!record || typeof record !== 'object') continue;
              totalRecords++;

              // ── Step 1: Confirm it is an IMAGE record ──────────────────────────────
              // Primary:   type field set to "image/*"  (always written by distribute-image.html)
              // Secondary: isMp3 explicitly set to false (older records without type field)
              // Exclude:   isMp3: true  (ringtones), missing type AND isMp3 not explicitly false
              const typeIsImage = typeof record.type === 'string' && record.type.startsWith('image/');
              const isExplicitlyImage = record.isImage === true;
              const isImplicitlyImage = record.isMp3 === false && !record.type; // only if type is absent
              const isImage = typeIsImage || isExplicitlyImage || isImplicitlyImage;

              // Content kind: WALLPAPER | WALLPAPER_24H | WALLPAPER_DUAL | WALLPAPER_BATTERY
              //             | LIVE_WALLPAPER | CHARGING_ANIMATION (videos accepted too)
              const kind = getRecordKind(record);
              const isVideoContent = !!VIDEO_KINDS[kind];

              if (!isImage && !isVideoContent) {
                skippedNotImage++;
                continue;
              }

              // ── Step 2: Only process records that are MISSING metadata ─────────────
              const missingTitle    = !record.title    || String(record.title).trim()    === '';
              const missingTags     = !record.tags     || String(record.tags).trim()     === '';
              const missingCategory = !record.category || String(record.category).trim() === '';
              const needsMetadata   = missingTitle || missingTags || missingCategory;

              if (!needsMetadata) {
                skippedHasMetadata++;
                continue; // already has full metadata — skip
              }

              // ── Step 3: Must have a downloadable image source ──────────────────────
              // fileUrl   = R2 URL (written by distribute-image.html)
              // imageUrl  = legacy remote URL
              // fileBase64 = inline base64 (older records)
              const setSlotUrl = SET_KINDS[kind] ? firstSlotUrl(record, kind) : '';
              const hasSource = !!(record.fileUrl || record.imageUrl || record.fileBase64 || setSlotUrl || (VIDEO_KINDS[kind] && record.thumbUrl)); // v27.10 video thumb
              if (!hasSource) {
                skippedNoData++;
                console.warn(`  ⚠️  [${key}] Skipped — no fileUrl / imageUrl / fileBase64 / set slot file found.`);
                continue;
              }

              const sourceType = record.fileUrl ? 'R2 fileUrl' : record.imageUrl ? 'imageUrl' : record.fileBase64 ? 'fileBase64' : 'set slot file (R2)';
              const missing = [
                missingTitle    ? 'title'    : null,
                missingTags     ? 'tags'     : null,
                missingCategory ? 'category' : null,
              ].filter(Boolean).join(', ');
              console.log(`  ✅ [${key}] Queued — ${kindLabel(kind)} | source: ${sourceType} | missing: ${missing}`);
              candidates.push({ key, record, kind });
            }

            console.log(`  📊 Scan complete: ${totalRecords} total | ${skippedNotImage} not-image | ${skippedHasMetadata} already-done | ${skippedNoData} no-source | ${candidates.length} to process`);
            return candidates;
          }

          // ─── ZEDGE CONTENT POLICY GUARD (v21) ─────────────────────────────────────
          // Enforces Zedge's Content Guidelines on everything this workflow produces:
          // original-only (no artists, songs, characters, brands, logos, celebrities), no
          // adult / hate / violence / drugs / illegal content, accurate non-promotional
          // metadata, 2–10 real tags. Violations are regenerated or skipped — never uploaded.
          const ZEDGE_POLICY_RULES = `ZEDGE MARKETPLACE POLICY (MANDATORY — a single violation permanently suspends the seller account):
          - 100% ORIGINAL work only. Never name, reference, imitate or hint at any real artist, band, singer, song, lyric, album, film, TV show, game, anime, cartoon, comic, character, franchise, brand, company, product, logo, trademark, sports team, celebrity or public figure. No "in the style of", no "sounds like", no theme/cover/remix of anything existing.
          - No sexual, suggestive, nude or adult content. No hate speech, slurs, hate symbols, discrimination or stereotypes. No violence, gore, weapons, drugs, self-harm or illegal activity. Nothing involving minors.
          - Metadata must be truthful and describe ONLY this item. No promotional or spam words (free, download, app, website, subscribe, follow, link, buy), no URLs, hashtags, @handles, emojis, brand or service names, no misleading keywords.
          - Keywords: between 2 and 10 genuine descriptive single words. The category name (or any word of it) must NOT be used as a keyword.`;
          const POLICY_PROMO = /\b(free|download|downloads|website|subscribe|follow|buy|sale|discount|promo|www|http|https|telegram|whatsapp|instagram|tiktok|youtube|facebook|twitter|zedge)\b/i;
          const POLICY_ADULT = /\b(sexy|sex|sexual|nude|nudity|naked|porn|porno|xxx|erotic|erotica|boobs|breasts?|booty|bikini|lingerie|topless|hot girls?|seductive|nsfw|hentai|fetish|stripper|thong|underwear|cleavage)\b/i;
          const POLICY_HARM = /\b(nigg\w*|fagg?\w*|retard\w*|murder|gore|gun|guns|rifle|pistol|shooting|shooter|terror\w*|nazi|hitler|swastika|isis|jihad|marijuana|cocaine|heroin|meth|drugs|suicide|self-harm|rape|racist|slur)\b/i;
          const POLICY_IP = /\b(disney|pixar|marvel|dc comics|batman|superman|spider-?man|iron ?man|avengers|wolverine|x-?men|deadpool|harley quinn|star ?wars|darth|vader|yoda|jedi|mandalorian|grogu|harry ?potter|hogwarts|lord of the rings|hobbit|game of thrones|stranger things|squid game|breaking bad|pokemon|pikachu|charizard|super mario|luigi|zelda|minecraft|fortnite|roblox|among us|gta|call of duty|pubg|free fire|valorant|league of legends|overwatch|god of war|kratos|elden ring|naruto|goku|dragon ?ball|one piece|luffy|attack on titan|demon slayer|jujutsu|gojo|itachi|sasuke|death note|my hero academia|hello kitty|sanrio|mickey|minnie|donald duck|elsa|moana|encanto|toy story|shrek|minions|despicable|kung fu panda|spongebob|simpsons|rick and morty|peppa|paw patrol|barbie|hot wheels|lego|nike|adidas|puma|gucci|louis vuitton|iphone|samsung|xiaomi|oneplus|huawei|tesla|bmw|mercedes|audi|ferrari|lamborghini|porsche|toyota|coca-?cola|pepsi|starbucks|mcdonald'?s|kfc|netflix|spotify|nfl|nba|fifa|uefa|real madrid|barcelona|manchester united|liverpool fc|juventus|psg|messi|ronaldo|neymar|mbappe|lebron|taylor swift|beyonce|drake|eminem|rihanna|bts|blackpink|billie eilish|ed sheeran|weeknd|bad bunny|justin bieber|ariana grande|dua lipa|coldplay|imagine dragons|linkin park|metallica|beatles|nirvana|michael jackson|elvis|kanye|travis scott|post malone|shakira|adele|bruno mars|hans zimmer|john williams|bollywood|shah rukh|salman khan|allu arjun|pushpa|kgf|pathaan|jawan|kabir singh|arijit|pritam|ar rahman|a\.r\. rahman|anirudh|nokia|nokia tune|marimba|over the horizon|xbox|playstation|nintendo|godzilla|king kong|jurassic|transformers|optimus prime|bumblebee|pirates of the caribbean|jack sparrow|james bond|mission impossible|john wick|fast and furious|terminator|poppy playtime|huggy wuggy|skibidi|fnaf|cuphead|genshin|honkai|clash of clans|clash royale|brawl stars|candy crush|angry birds|subway surfers|temple run|flappy bird|tom and jerry|doraemon|shinchan|ben 10|scooby|looney|bugs bunny|winnie the pooh|cars movie|lightning mcqueen|olaf|stitch|lilo|baymax|zootopia|inside out|wednesday addams|squid|haikyuu|chainsaw man|spy x family|frieren|solo leveling|sung jinwoo)\b/i;
          function zedgePolicyIssues(meta) {
            const issues = [];
            const fields = { title: meta.title || '', tags: meta.tags || '', description: meta.description || '', prompt: meta.enhancedPrompt || '' };
            for (const [f, v] of Object.entries(fields)) {
              if (!v) continue;
              const ip = v.match(POLICY_IP); if (ip) issues.push(`${f}: protected name "${ip[0]}"`);
              const ad = v.match(POLICY_ADULT); if (ad) issues.push(`${f}: adult term "${ad[0]}"`);
              const hv = v.match(POLICY_HARM); if (hv) issues.push(`${f}: prohibited term "${hv[0]}"`);
              if (f !== 'prompt') {
                const pr = v.match(POLICY_PROMO); if (pr) issues.push(`${f}: promotional/spam word "${pr[0]}"`);
                if (/[#@]|https?:|www\.|\.(com|net|org|io|app)\b/i.test(v)) issues.push(`${f}: link/hashtag/handle`);
              }
            }
            return issues;
          }
          function zedgeCleanTags(tags) {
            const words = String(tags || '').split(/[,\s]+/).map(w => w.trim().toLowerCase()).filter(w => /^[a-z0-9-]{2,20}$/.test(w));
            const out = [];
            for (const w of words) if (!out.includes(w) && !POLICY_IP.test(w) && !POLICY_ADULT.test(w) && !POLICY_HARM.test(w) && !POLICY_PROMO.test(w)) out.push(w);
            return out.slice(0, 10);
          }
          // Returns { issues, meta } — meta has policy-clean, deduped, 2–10 tags.
          function zedgeEnforce(meta, kind) {
            const issues = zedgePolicyIssues(meta);
            const tags = zedgeCleanTags(meta.tags);
            const fallback = kind === 'image' ? ['wallpaper', 'background', 'art', 'design', 'phone', 'screen'] : ['melody', 'tune', 'alert', 'phone', 'music', 'sound'];
            // Zedge rule: the CATEGORY NAME must never appear as a keyword/tag (whole name, its words, singular/plural).
            const catWords = String(meta.category || '').toLowerCase().split(/[^a-z]+/).filter(w => w.length > 1 && w !== 'n' && w !== 'and');
            const catFull = String(meta.category || '').toLowerCase().replace(/[^a-z]/g, '');
            const stem = w => String(w).replace(/(ies|es|s)$/, '');
            const isCatWord = t => { const ts = stem(t); return t === catFull || ts === stem(catFull) || catWords.some(c => c === t || stem(c) === ts); };
            const clean = tags.filter(t => !isCatWord(t));
            for (const w of fallback) { if (clean.length >= 2) break; if (!clean.includes(w) && !isCatWord(w)) clean.push(w); }
            return { issues, meta: { ...meta, tags: clean.slice(0, 10).join(', ') } };
          }
          // ─── FIREBASE: PATCH METADATA ─────────────────────────────────────────────
          async function firebasePatchMetadata(dbUrl, queuePath, key, metadata) {
            const res = await fetch(`${dbUrl}/${queuePath}/${key}.json`, {
              method: 'PATCH',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(metadata)
            });
            if (!res.ok) {
              const err = await res.text();
              throw new Error(`Firebase PATCH failed (${res.status}): ${err.slice(0, 200)}`);
            }
            return await res.json();
          }

          // ─── DECODE MEDIA → TEMP IMAGE FILE ───────────────────────────────────────
          // Supports fileBase64 (data URL), remote imageUrl / fileUrl (R2), wallpaper
          // set slot files (24H / Dual / Battery), and video content — for videos a
          // single representative frame is extracted with ffmpeg for Gemini vision.
          async function imageToTempFile(record, key, kind) {
            const tmpDir = path.join(os.tmpdir(), 'img_meta');
            fs.mkdirSync(tmpDir, { recursive: true });

            if (record.fileBase64) {
              let base64Data = record.fileBase64;
              let ext = 'png';

              if (base64Data.startsWith('data:')) {
                const mimeMatch = base64Data.match(/data:([^;]+);base64,/);
                if (mimeMatch) {
                  const mime = mimeMatch[1];
                  ext = mime.split('/')[1] || 'png';
                }
                base64Data = base64Data.replace(/^data:[^;]+;base64,/, '');
              }

              const buffer = Buffer.from(base64Data, 'base64');
              const filePath = path.join(tmpDir, `${key}.${ext}`);
              fs.writeFileSync(filePath, buffer);
              console.log(`  💾 Saved image from fileBase64 → ${filePath} (${(buffer.length / 1024).toFixed(1)} KB)`);
              return filePath;

            } else {
              // fileUrl  = R2 URL saved by distribute-image.html
              // imageUrl = legacy field name (kept for backwards compatibility)
              // Wallpaper sets: fall back to the first slot file when fileUrl is absent
              // v27.10 video thumb: Live Wallpaper / Charging Animation records already carry a JPEG
              // thumbnail (thumbUrl, written by the panel + app). Use it directly - no multi-MB video
              // download, no ffmpeg dependency. Falls back to frame extraction only when thumbUrl is missing.
              if (VIDEO_KINDS[kind] && record.thumbUrl) {
                console.log(`  🎬 Video item - using thumbnail: ${record.thumbUrl}`);
                const tRes = await fetch(record.thumbUrl);
                if (tRes.ok) {
                  const tBuf = Buffer.from(await tRes.arrayBuffer());
                  if (tBuf.length > 1024) {
                    const tPath = path.join(tmpDir, `${key}.jpg`);
                    fs.writeFileSync(tPath, tBuf);
                    console.log(`  💾 Saved video thumbnail → ${tPath} (${(tBuf.length / 1024).toFixed(1)} KB)`);
                    return tPath;
                  }
                }
                console.warn(`  ⚠️  Thumbnail fetch failed (HTTP ${tRes.status}) - falling back to video frame extraction`);
              }
              const remoteUrl = record.fileUrl || record.imageUrl || (SET_KINDS[kind] ? firstSlotUrl(record, kind) : '');
              if (!remoteUrl) throw new Error('No fileBase64, fileUrl, imageUrl, or set slot file found on record.');
              const urlSource = record.fileUrl ? 'fileUrl (R2)' : record.imageUrl ? 'imageUrl' : 'set slot file (R2)';
              console.log(`  🌐 Downloading from ${urlSource}: ${remoteUrl}`);
              const res = await fetch(remoteUrl);
              if (!res.ok) throw new Error(`Failed to fetch ${urlSource} (HTTP ${res.status}): ${remoteUrl}`);
              const buffer = Buffer.from(await res.arrayBuffer());
              const contentType = res.headers.get('content-type') || 'image/jpeg';
              const ext = contentType.split('/')[1]?.split(';')[0] || 'jpg';

              // VIDEO CONTENT (Live Wallpaper / Charging Animation): save the video,
              // then extract a single representative frame with ffmpeg for Gemini.
              if (VIDEO_KINDS[kind] || contentType.startsWith('video/')) {
                const videoExt = contentType.startsWith('video/') ? ext : 'mp4';
                const videoPath = path.join(tmpDir, `${key}_video.${videoExt}`);
                fs.writeFileSync(videoPath, buffer);
                console.log(`  💾 Downloaded video → ${videoPath} (${(buffer.length / 1024).toFixed(1)} KB)`);
                const framePath = path.join(tmpDir, `${key}.jpg`);
                try {
                  execSync(`ffmpeg -y -ss 1 -i "${videoPath}" -frames:v 1 -q:v 3 "${framePath}"`, { stdio: 'pipe' });
                } catch (e) {
                  // Very short clips can fail at -ss 1 — retry from the very first frame
                  execSync(`ffmpeg -y -i "${videoPath}" -frames:v 1 -q:v 3 "${framePath}"`, { stdio: 'pipe' });
                }
                try { fs.unlinkSync(videoPath); } catch {}
                if (!fs.existsSync(framePath) || !fs.statSync(framePath).size) {
                  throw new Error('ffmpeg could not extract a frame from the video.');
                }
                console.log(`  🎬 Extracted video frame → ${framePath}`);
                return framePath;
              }

              const filePath = path.join(tmpDir, `${key}.${ext}`);
              fs.writeFileSync(filePath, buffer);
              console.log(`  💾 Downloaded from ${urlSource} → ${filePath} (${(buffer.length / 1024).toFixed(1)} KB)`);
              return filePath;
            }
          }

          // ─── GEMINI WEB: SEND TEXT PROMPT AND WAIT FOR RESPONSE ──────────────────
          async function callGeminiWeb(promptText, geminiPage, opts = {}) {
            console.log(`    🌐 Sending prompt (${promptText.length} chars)...`);

            const inputSel = 'div.ql-editor[contenteditable="true"]';
            await geminiPage.waitForSelector(inputSel, { timeout: 15000 });
            // Dismiss any overlay blocking the input before clicking
            try { await geminiPage.keyboard.press('Escape'); await sleep(300); } catch (_) {}
            // Use { force: true } to click through any invisible overlay layer
            await geminiPage.click(inputSel, { force: true });
            await geminiPage.keyboard.press('Control+a');
            await geminiPage.keyboard.press('Delete');
            await sleep(200);

            const getResponseCount = () => geminiPage.evaluate(() => {
              const selectors = [
                'div[id^="model-response-message-content"]',
                'div[id^="response-message-content"]',
                '.response-content-container',
                'message-content',
                'div.message-content'
              ];
              const seen = new Set();
              for (const sel of selectors) {
                document.querySelectorAll(sel).forEach(el => seen.add(el));
              }
              return seen.size;
            }).catch(() => 0);

            const initialCount = await getResponseCount();

            await geminiPage.keyboard.insertText(promptText);
            await sleep(500);
            await geminiPage.keyboard.press('Enter');
            console.log(`    ⌨️  Submitted via Enter key`);

            const deadline = Date.now() + 90000;
            // v27.10: a reply is only accepted once it contains the closing tag of the LAST template section
            // (opts.completeWhen). Before, a 3 s pause while Gemini was still streaming was mistaken for a
            // finished answer -> half a template got parsed -> the audio prompt silently fell back to
            // "electronic synth pulse" while title/tags described another sound (ringtone != metadata).
            const completeRe = opts.completeWhen || null;
            const softDeadline = Date.now() + 75000;   // after this a stable partial reply is accepted (the parser validates it)
            let responseText = '';
            let lastSeen = '';
            let stableCount = 0;

            while (Date.now() < deadline) {
              await sleep(1500);
              const currentCount = await getResponseCount();
              if (currentCount <= initialCount) continue;

              const latestText = await geminiPage.evaluate(() => {
                const selectors = [
                  'div[id^="model-response-message-content"]',
                  'div[id^="response-message-content"]',
                  '.response-content p',
                  'message-content',
                  'div.message-content'
                ];
                const allMatching = [];
                for (const sel of selectors) {
                  document.querySelectorAll(sel).forEach(el => allMatching.push(el));
                }
                if (allMatching.length === 0) return '';
                allMatching.sort((a, b) => (a.compareDocumentPosition(b) & 4) ? -1 : 1);
                const lastEl = allMatching[allMatching.length - 1];
                return lastEl ? (lastEl.innerText || lastEl.textContent || '').trim() : '';
              }).catch(() => '');

              if (!latestText) continue;

              if (latestText === lastSeen) {
                stableCount++;
                if (stableCount >= 2 && (!completeRe || completeRe.test(latestText) || Date.now() > softDeadline)) { responseText = latestText; break; }
              } else {
                lastSeen = latestText;
                stableCount = 0;
              }
            }

            if (!responseText) throw new Error('Gemini web timeout: no response within 90s');
            console.log(`    ✅ Got response (${responseText.length} chars)`);
            return responseText;
          }

          // ─── GEMINI: CHECK WHETHER AN IMAGE ATTACHMENT IS VISIBLE ─────────────────
          async function hasImageAttached(geminiPage) {
            return geminiPage.evaluate(() => [
              'ms-file-attachment',
              'upload-progress-thumbnail',
              '[class*="upload-thumbnail"]',
              '[class*="file-chip"]',
              '[class*="attachment"]',
              '[class*="FileChip"]',
              'rich-textarea img',
              '[data-test-id*="attachment"]',
              '[data-test-id*="upload"]',
              '.attachment-chip',
              '.upload-thumbnail',
            ].some(s => document.querySelector(s))).catch(() => false);
          }

          // ─── GEMINI: UPLOAD IMAGE FILE ─────────────────────────────────────────────
          // PRIMARY: Playwright's native setInputFiles() via the "Open upload file menu"
          // button — the same mechanism the Rigatone extension uses.
          // FALLBACK: evaluate()-based strategies (clipboard, drag, file-input-override).
          async function uploadImageToGemini(imagePath, geminiPage) {
            console.log(`    📎 Uploading image: ${path.basename(imagePath)}`);

            const mimeType = imagePath.endsWith('.jpg') || imagePath.endsWith('.jpeg')
              ? 'image/jpeg'
              : imagePath.endsWith('.webp') ? 'image/webp' : 'image/png';

            // Log DOM state for debugging
            const domDebug = await geminiPage.evaluate(() => ({
              fileInputs : document.querySelectorAll('input[type="file"]').length,
              editors    : document.querySelectorAll('div.ql-editor, rich-textarea').length,
              ariaButtons: [...document.querySelectorAll('button[aria-label]')]
                             .map(b => b.getAttribute('aria-label')).filter(Boolean).slice(0, 15),
            })).catch(() => ({}));
            console.log(`    🔍 DOM: fileInputs=${domDebug.fileInputs}, editors=${domDebug.editors}`);
            console.log(`    🔍 aria-labels: ${JSON.stringify(domDebug.ariaButtons)}`);

            // ── STRATEGY A: Native setInputFiles via upload button (most reliable) ────
            // Clicks "Open upload file menu" → waits for file input → setInputFiles()
            // This mirrors exactly what the Rigatone extension does in the browser.
            try {
              // Try aria-label variants Gemini uses for the upload/attachment button
              const uploadBtnSelectors = [
                'button[aria-label="Open upload file menu"]',
                'button[aria-label="Upload file"]',
                'button[aria-label="Add image"]',
                'button[aria-label="Attach files"]',
                '[aria-label="Open upload file menu"]',
                '[data-test-id="upload-button"]',
              ];

              let uploadBtnClicked = false;
              for (const sel of uploadBtnSelectors) {
                try {
                  const btn = await geminiPage.$(sel);
                  if (btn) {
                    await btn.click();
                    console.log(`    🖱️  Clicked upload button: ${sel}`);
                    uploadBtnClicked = true;
                    break;
                  }
                } catch (_) {}
              }

              if (!uploadBtnClicked) {
                // Fallback: find by aria-label text match in page evaluate
                uploadBtnClicked = await geminiPage.evaluate(() => {
                  const btn = [...document.querySelectorAll('button, [role="button"]')].find(el => {
                    const label = (el.getAttribute('aria-label') || '').toLowerCase();
                    return label.includes('upload') || label.includes('attach') || label.includes('add image');
                  });
                  if (btn) { btn.click(); return true; }
                  return false;
                });
                if (uploadBtnClicked) console.log('    🖱️  Clicked upload button via evaluate fallback');
              }

              if (uploadBtnClicked) {
                // Wait for a file input to appear (hidden inputs become temporarily accessible)
                const fileInput = await geminiPage.waitForSelector('input[type="file"]', { timeout: 5000 }).catch(() => null);
                if (fileInput) {
                  // Use Playwright's native setInputFiles — bypasses all JS injection complexity
                  await fileInput.setInputFiles(imagePath);
                  console.log('    ✅ Image attached via strategy: setInputFiles (native Playwright)');
                  await sleep(1500);
                  return true;
                }
              }
            } catch (e) {
              console.log(`    ⚠️  setInputFiles strategy failed: ${e.message}`);
            }

            // ── STRATEGY B: Playwright filechooser intercept ──────────────────────────
            // Triggers the file chooser dialog by clicking any upload button.
            try {
              const [fileChooser] = await Promise.all([
                geminiPage.waitForEvent('filechooser', { timeout: 4000 }),
                geminiPage.evaluate(() => {
                  const btn = [...document.querySelectorAll('button, [role="button"]')].find(el => {
                    const label = (el.getAttribute('aria-label') || el.textContent || '').toLowerCase();
                    return label.includes('upload') || label.includes('attach') || label.includes('add image');
                  });
                  if (btn) btn.click();
                }),
              ]);
              await fileChooser.setFiles(imagePath);
              console.log('    ✅ Image attached via strategy: filechooser-intercept');
              await sleep(1500);
              return true;
            } catch (_) {}

            // ── STRATEGY C: evaluate()-based injection (clipboard / drag / file-input) ─
            const imageBuffer = fs.readFileSync(imagePath);
            const base64Data  = imageBuffer.toString('base64');
            const dataUrl = `data:${mimeType};base64,${base64Data}`;

            const result = await geminiPage.evaluate(async ({ dataUrl, name, mime }) => {

              function dataUrlToFile(dataUrl, name, type) {
                const arr  = dataUrl.split(',');
                const bstr = atob(arr[1]);
                let n = bstr.length;
                const u8 = new Uint8Array(n);
                while (n--) u8[n] = bstr.charCodeAt(n);
                return new File([u8], name, { type });
              }

              function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

              function hasAttachment() {
                return [
                  'ms-file-attachment', 'upload-progress-thumbnail',
                  '[class*="upload-thumbnail"]', '[class*="file-chip"]',
                  '[class*="attachment"]', '[class*="FileChip"]',
                  '[jsname][class*="chip"]', 'rich-textarea img',
                  '[data-test-id*="attachment"]', '[data-test-id*="upload"]',
                  '.attachment-chip', '.upload-thumbnail',
                ].some(s => document.querySelector(s));
              }

              const files = [dataUrlToFile(dataUrl, name, mime)];

              // C1: ClipboardEvent paste
              try {
                const editor =
                  document.querySelector('rich-textarea [contenteditable="true"]') ||
                  document.querySelector('.ql-editor') ||
                  document.querySelector('[contenteditable="true"]');
                if (editor) {
                  editor.focus();
                  for (const file of files) {
                    const dt = new DataTransfer();
                    dt.items.add(file);
                    editor.dispatchEvent(new ClipboardEvent('paste', { bubbles: true, cancelable: true, clipboardData: dt }));
                    await delay(150);
                  }
                  await delay(700);
                  if (hasAttachment()) return { ok: true, strategy: 'clipboard-paste' };
                }
              } catch (_) {}

              // C2: Broad DragEvent broadcast
              try {
                const dt = new DataTransfer();
                files.forEach(f => dt.items.add(f));
                const opts = { bubbles: true, cancelable: true, dataTransfer: dt };
                window.dispatchEvent(new DragEvent('dragenter', opts));
                document.dispatchEvent(new DragEvent('dragenter', opts));
                await delay(150);
                window.dispatchEvent(new DragEvent('dragover', opts));
                document.dispatchEvent(new DragEvent('dragover', opts));
                await delay(250);
                const targets = [
                  document.querySelector('[data-filedrop-id="chat-window-input-container"]'),
                  document.querySelector('file-drop-indicator'),
                  document.querySelector('.input-area-container'),
                  document.querySelector('.input-area'),
                  document.querySelector('rich-textarea'),
                  document.querySelector('[contenteditable="true"]'),
                  document.querySelector('fieldset'),
                  document.body,
                ].filter(Boolean);
                for (const el of targets) { el.dispatchEvent(new DragEvent('drop', opts)); await delay(80); }
                document.dispatchEvent(new DragEvent('drop', opts));
                window.dispatchEvent(new DragEvent('drop', opts));
                await delay(800);
                if (hasAttachment()) return { ok: true, strategy: 'drag-broadcast' };
              } catch (_) {}

              // C3: file-input override on existing hidden inputs
              try {
                const inputs = [...document.querySelectorAll('input[type="file"]')];
                let tried = 0;
                for (const inp of inputs) {
                  try {
                    const dt2 = new DataTransfer();
                    files.forEach(f => dt2.items.add(f));
                    Object.defineProperty(inp, 'files', { value: dt2.files, configurable: true });
                    inp.dispatchEvent(new Event('change', { bubbles: true }));
                    inp.dispatchEvent(new Event('input',  { bubbles: true }));
                    tried++;
                  } catch (_) {}
                }
                if (tried) {
                  await delay(700);
                  if (hasAttachment()) return { ok: true, strategy: 'file-input-override' };
                }
              } catch (_) {}

              return { ok: false, strategy: 'all-failed' };

            }, { dataUrl, name: path.basename(imagePath), mime: mimeType });

            if (result.ok) {
              console.log(`    ✅ Image attached via strategy: ${result.strategy}`);
              return true;
            }

            // All strategies failed — take a debug screenshot
            console.warn('    ❌ All strategies exhausted. Taking debug screenshot...');
            try {
              const screenshotPath = `/tmp/gemini_upload_fail_${Date.now()}.png`;
              await geminiPage.screenshot({ path: screenshotPath, fullPage: false });
              console.warn(`    📸 Screenshot saved: ${screenshotPath}`);
            } catch (e) {
              console.warn(`    📸 Screenshot failed: ${e.message}`);
            }
            return false;
          }

          // ─── GENERATE METADATA FOR ONE IMAGE VIA GEMINI ───────────────────────────
          async function generateImageMetadata(imagePath, key, geminiPage, kind) {
            console.log(`  🤖 Generating metadata for image [${key}]...`);

            // Open a fresh Gemini chat for each image
            console.log('  🌐 Opening fresh Gemini chat...');
            await geminiPage.goto('https://gemini.google.com/app/new', { waitUntil: 'domcontentloaded', timeout: 30000 });
            await sleep(3000);

            // Dismiss any overlays / cookie banners / "What's new" modals
            // First try Escape key to close any overlay blocking the input
            try { await geminiPage.keyboard.press('Escape'); await sleep(500); } catch (_) {}
            const dismissSels = [
              'button:has-text("I agree")', 'button:has-text("Agree")',
              'button:has-text("Got it")', 'button:has-text("Dismiss")',
              'button:has-text("Close")', 'button:has-text("OK")',
              'button:has-text("Continue")', 'button:has-text("Skip")'
            ];
            for (const sel of dismissSels) {
              try {
                if (await geminiPage.isVisible(sel)) {
                  await geminiPage.click(sel);
                  await sleep(600);
                }
              } catch (e) {}
            }
            // One more Escape in case a secondary dialog appeared
            try { await geminiPage.keyboard.press('Escape'); await sleep(400); } catch (_) {}

            // Verify the chat input is ready (session already validated at startup)
            const inputVisible = await geminiPage.isVisible('div.ql-editor[contenteditable="true"], rich-textarea [contenteditable="true"]').catch(() => false);
            if (!inputVisible) {
              // Take debug screenshot
              const screenshotPath = `/tmp/gemini_no_input_${Date.now()}.png`;
              await geminiPage.screenshot({ path: screenshotPath }).catch(() => {});
              console.warn(`   ⚠️  Input not found — screenshot: ${screenshotPath}`);
              throw new Error('Gemini chat input not found. The page may not have loaded correctly.');
            }

            // Upload the image using setInputFiles (native Playwright) + fallback strategies
            const uploaded = await uploadImageToGemini(imagePath, geminiPage);
            if (!uploaded) {
              throw new Error('Could not attach image to Gemini after all strategies.');
            }
            await sleep(1500);

            // Build the metadata prompt (content-kind aware: wallpaper / set / video)
            const validCategories = VALID_IMG_CATS.filter(c => c !== 'OTHER').join(', ');
            const kindContext = KIND_PROMPT_CONTEXT[kind] || KIND_PROMPT_CONTEXT.WALLPAPER;
            const METADATA_PROMPT =
              `You are an expert image curator, SEO metadata specialist and Zedge marketplace compliance reviewer.\n\n${ZEDGE_POLICY_RULES}\n\n` +
              `${kindContext}\n` +
              `Look at the attached image carefully and generate the following metadata:\n` +
              `1. A creative and UNIQUE TITLE (max 25 characters). Use evocative, descriptive words. Avoid generic filler words like "beautiful", "amazing", "stunning". No quotes.\n` +
              `2. 15 relevant, descriptive single-word KEYWORDS (comma-separated). Cover the subject, colors, mood, style, and use-case. NEVER use the category name (or any word of it, singular or plural) as a keyword.\n` +
              `3. The most appropriate CATEGORY selected ONLY from this list: ${validCategories}.\n` +
              `4. A SHORT description in MAXIMUM 5 WORDS. No punctuation, no full sentences.\n` +
              `5. POLICY verdict: write OK if this image is clearly safe and original under the policy above. Otherwise write FLAG: <short reason> — flag any recognizable copyrighted character, franchise art, brand/logo/trademark, celebrity or real identifiable person (selfie, family photo), text watermark, sexual/suggestive content, hate symbol, violence, weapons, drugs, apparent minors, or a stretched / blurry / badly cropped low-quality image.\n\n` +
              `CRITICAL: Format your ENTIRE response EXACTLY like this — no other text outside these tags:\n` +
              `[TITLE]...[/TITLE]\n` +
              `[KEYWORDS]...[/KEYWORDS]\n` +
              `[CATEGORY]...[/CATEGORY]\n` +
              `[DESCRIPTION]...[/DESCRIPTION]\n` +
              `[POLICY]OK or FLAG: reason[/POLICY]`;

            const responseText = await callGeminiWeb(METADATA_PROMPT, geminiPage, { completeWhen: /\[\s*\/\s*POLICY\s*\]/i });

            // Parse response tags
            const getTagValue = (text, tag) => {
              // v27.10 tolerant parser: Gemini renders markdown, so "[ENHANCED_PROMPT]" can come back as
              // "**[ENHANCED PROMPT]**", "[ENHANCEDPROMPT]", with a ":" after it, or without its closing tag.
              // The old strict regex then returned '' and the caller silently used a fallback value.
              const t = tag.replace(/_/g, '[_ \\-]?');
              const open = new RegExp(`\\[\\s*${t}\\s*\\]\\s*:?`, 'i');
              const m = text.match(open);
              if (!m) return '';
              let rest = text.slice(m.index + m[0].length);
              const close = rest.match(new RegExp(`\\[\\s*\\/\\s*${t}\\s*\\]`, 'i'));
              if (close) rest = rest.slice(0, close.index);
              else { const nx = rest.match(/\[\s*\/?\s*(ENHANCED[_ -]?PROMPT|TITLE|KEYWORDS|CATEGORY|DESCRIPTION|POLICY)\s*\]/i); if (nx) rest = rest.slice(0, nx.index); }
              rest = rest.replace(/\*\*/g, '').replace(/^`+|`+$/g, '').replace(/^\s*:\s*/, '').trim();
              return /^(\.{3}|\u2026)$/.test(rest) ? '' : rest;   // the literal "..." template placeholder counts as missing
            };

            const title       = cleanTitle(getTagValue(responseText, 'TITLE'))       || `Image ${key.slice(0, 8)}`;
            const tags        = cleanKeywords(getTagValue(responseText, 'KEYWORDS'));
            const category    = cleanCategory(getTagValue(responseText, 'CATEGORY'));
            const description = cleanDescription(getTagValue(responseText, 'DESCRIPTION'));

            console.log(`  ✨ Title    : "${title}"`);
            console.log(`  🏷️  Tags     : ${tags}`);
            console.log(`  📁 Category : ${category}`);
            console.log(`  📝 Desc     : ${description}`);

            const policy = getTagValue(responseText, 'POLICY');
            console.log(`  🛡️  Policy   : ${policy || '(no verdict)'}`);
            return { title, tags, category, description, policy };
          }

          // ─── MAIN ─────────────────────────────────────────────────────────────────
          console.log('============================================================');
          console.log('  🖼️   IMAGE METADATA GENERATOR → FIREBASE');
          console.log('============================================================');
          console.log('📋 Max images to process : All (unlimited)');
          console.log(`📂 Queue path            : ${IMAGE_QUEUE_PATH}`);
          console.log(`🎯 Target account        : ${TARGET_ACCOUNT}`);
          TARGET_DB_URLS.forEach(d => console.log(`   🔥 ${d.name}: ${d.url}`));
          console.log('🌐 Gemini Mode           : Web scraping (gemini.google.com)');
          console.log('============================================================\n');

          // ─── INIT GEMINI BROWSER (shared across all images) ───────────────────────
          let geminiBrowser = null;
          let geminiPage    = null;

          try {
            console.log('🌐 Launching Gemini browser (stealth mode)...');
            const { chromium } = await import('playwright-extra');
            const { default: StealthPlugin } = await import('puppeteer-extra-plugin-stealth');
            chromium.use(StealthPlugin());

            geminiBrowser = await chromium.launch({
              headless: false,
              args: [
                '--no-sandbox', '--disable-setuid-sandbox',
                '--disable-dev-shm-usage',
                '--disable-blink-features=AutomationControlled',
                '--disable-web-security',
                '--disable-features=IsolateOrigins,site-per-process'
              ]
            });

            const VIDEO_DIR = '/tmp/playwright-videos';
            fs.mkdirSync(VIDEO_DIR, { recursive: true });

            // Use the file path (not the object) — this is more reliable for
            // Playwright to correctly restore both cookies AND localStorage.
            const context = await geminiBrowser.newContext({
              storageState: STORAGE_STATE_FILE,
              userAgent: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36',
              viewport: { width: 1280, height: 800 },
              acceptDownloads: true,
              recordVideo: {
                dir: VIDEO_DIR,
                size: { width: 1280, height: 800 }
              }
            });

            geminiPage = await context.newPage();

            // ── SESSION VERIFICATION ─────────────────────────────────────────
            console.log('🔐 Verifying session is alive...');
            await geminiPage.goto('https://gemini.google.com/app', {
              waitUntil: 'domcontentloaded',
              timeout: 30000
            });
            await sleep(4000);

            const currentUrl = geminiPage.url();
            console.log(`   Current URL after navigation: ${currentUrl}`);

            // Check if we got redirected to accounts/login
            const isLoggedOut =
              currentUrl.includes('accounts.google.com') ||
              currentUrl.includes('/signin') ||
              currentUrl.includes('/login') ||
              currentUrl.includes('ServiceLogin');

            if (isLoggedOut) {
              // Take a screenshot for debugging
              const screenshotPath = '/tmp/session_failure.png';
              await geminiPage.screenshot({ path: screenshotPath, fullPage: true }).catch(() => {});
              console.error(`❌ Session FAILED — redirected to login page: ${currentUrl}`);
              console.error('   The GEMINI_SESSION cookies are expired or invalid.');
              console.error('   Please re-export a fresh session using the Rigatone extension.');
              console.error(`   Debug screenshot saved: ${screenshotPath}`);
              process.exit(1);
            }

            // Also check the page title doesn't indicate sign-in
            const pageTitle = await geminiPage.title().catch(() => '');
            console.log(`   Page title: "${pageTitle}"`);
            if (pageTitle.toLowerCase().includes('sign in') || pageTitle.toLowerCase().includes('google accounts')) {
              console.error('❌ Session FAILED — page title indicates sign-in page.');
              console.error('   The GEMINI_SESSION cookies are expired or invalid.');
              process.exit(1);
            }

            console.log('✅ Session verified — Gemini browser initialized.\n');

          } catch (err) {
            console.error(`❌ Failed to launch Gemini browser: ${err.message}`);
            process.exit(1);
          }

          // ─── PROCESS EACH DB TARGET ───────────────────────────────────────────────
          let totalSuccess = 0;
          let totalHeld = 0;
          let totalFailed  = 0;

          // ─── LOCAL-JOBS MODE (Image Studio, mode: image_studio) ──────────────────
          // When META_LOCAL_DIR is set the script does NOT scan Firebase. Instead it watches
          // META_LOCAL_DIR/jobs/*.json  ({ id, imagePath, kind })  written by studio_server.mjs,
          // runs the SAME Gemini-Web flow + Zedge policy check on the local JPG and writes
          // META_LOCAL_DIR/results/<id>.json. The browser stays open until META_LOCAL_DIR/stop
          // exists, so every set/image gets its title/tags/category BEFORE it is pushed to
          // Firebase — exactly like the ringtone job (metadata first, then the queued record).
          const META_LOCAL_DIR = (process.env.META_LOCAL_DIR || '').trim();
          if (META_LOCAL_DIR) {
            const jobsDir = path.join(META_LOCAL_DIR, 'jobs');
            const resDir  = path.join(META_LOCAL_DIR, 'results');
            const stopFile = path.join(META_LOCAL_DIR, 'stop');
            fs.mkdirSync(jobsDir, { recursive: true });
            fs.mkdirSync(resDir, { recursive: true });
            console.log(`\n🗂️  Local-jobs mode — watching ${jobsDir} (Image Studio). Firebase scan is skipped.`);
            console.log('   READY_FOR_LOCAL_JOBS');
            let idleTicks = 0;
            // Gemini-Web safety: sequential jobs, a growing pause after each failure, and a real cool-down
            // (page reload + 60–180 s rest) after 3 failures in a row, so retries never hammer Gemini.
            let consecutiveFailures = 0;
            const pauseAfterFailure = () => Math.min(90000, 8000 * Math.pow(2, Math.max(0, consecutiveFailures - 1)));
            while (!fs.existsSync(stopFile)) {
              const files = fs.readdirSync(jobsDir).filter(f => f.endsWith('.json')).sort();
              if (!files.length) {
                if (++idleTicks % 60 === 0) console.log('   💤 idle — waiting for new images…');
                await sleep(2000);
                continue;
              }
              idleTicks = 0;
              for (const f of files) {
                if (fs.existsSync(stopFile)) break;
                const jobPath = path.join(jobsDir, f);
                let job;
                try { job = JSON.parse(fs.readFileSync(jobPath, 'utf8')); }
                catch (e) { console.error(`  ❌ [local] bad job file ${f}: ${e.message}`); try { fs.unlinkSync(jobPath); } catch {} continue; }
                const id = String(job.id || path.basename(f, '.json'));
                const kind = SET_KINDS[job.kind] ? job.kind : 'WALLPAPER';
                if (job.notBefore && Date.now() < job.notBefore) continue;   // retry scheduled for later by the studio
                console.log(`\n  [local] Key: ${id} — ${kindLabel(kind)} (${path.basename(job.imagePath || '')})${job.attempt > 1 ? ` · retry ${job.attempt}` : ''}`);
                const out = { id, kind, imagePath: job.imagePath, startedAt: Date.now() };
                try {
                  if (!job.imagePath || !fs.existsSync(job.imagePath)) throw new Error(`image file not found: ${job.imagePath}`);
                  let metadata = await generateImageMetadata(job.imagePath, id, geminiPage, kind);
                  let check = zedgeEnforce(metadata, 'image');
                  if (check.issues.length) {
                    console.warn(`  🚫 [local] [${id}] Zedge policy: ${check.issues.join('; ')} — regenerating metadata once`);
                    await sleep(2000);
                    metadata = await generateImageMetadata(job.imagePath, id, geminiPage, kind);
                    check = zedgeEnforce(metadata, 'image');
                  }
                  const verdict = String(metadata.policy || '').trim();
                  const flag = /^FLAG/i.test(verdict) ? verdict.replace(/^FLAG\s*:?\s*/i, '').trim() || 'flagged by policy review' : '';
                  const reason = flag || (check.issues.length ? `metadata could not be made policy-safe: ${check.issues.join('; ')}` : '');
                  Object.assign(out, {
                    ok: true,
                    title: check.meta.title, tags: check.meta.tags, category: check.meta.category, description: check.meta.description,
                    policyCheck: reason ? 'held' : 'passed', policyFlag: reason, issues: check.issues, finishedAt: Date.now()
                  });
                  if (reason) { totalHeld++; console.warn(`  🛑 [local] [${id}] HELD (Zedge policy): ${reason}`); }
                  else { totalSuccess++; console.log(`  ✅ [local] [${id}] Metadata generated: "${check.meta.title}" · ${check.meta.category}`); }
                  consecutiveFailures = 0;
                } catch (err) {
                  totalFailed++; consecutiveFailures++;
                  Object.assign(out, { ok: false, error: err.message, consecutiveFailures, finishedAt: Date.now() });
                  console.error(`  ❌ [local] [${id}] Failed: ${err.message}`);
                }
                const tmp = path.join(resDir, `${id}.json.tmp`);
                fs.writeFileSync(tmp, JSON.stringify(out));
                fs.renameSync(tmp, path.join(resDir, `${id}.json`));
                try { fs.unlinkSync(jobPath); } catch {}
                if (consecutiveFailures >= 3) {
                  const rest = Math.min(180000, 60000 * (consecutiveFailures - 2));
                  console.warn(`  🧊 [local] ${consecutiveFailures} failures in a row — cooling down ${Math.round(rest / 1000)} s and reloading Gemini Web`);
                  try { await geminiPage.goto('https://gemini.google.com/app', { waitUntil: 'domcontentloaded', timeout: 30000 }); } catch {}
                  await sleep(rest);
                } else if (consecutiveFailures > 0) {
                  console.log(`  ⏳ [local] pausing ${Math.round(pauseAfterFailure() / 1000)} s after a failure`);
                  await sleep(pauseAfterFailure());
                } else {
                  await sleep(2000);
                }
              }
            }
            console.log('\n🛑 [local] stop requested — closing Gemini browser.');
          }

          for (const db of (META_LOCAL_DIR ? [] : TARGET_DB_URLS)) {
            console.log(`\n🔥 Processing DB: ${db.name} (${db.url})`);

            let candidates;
            try {
              candidates = await scanImagesWithoutMetadata(db.url, IMAGE_QUEUE_PATH);
            } catch (err) {
              console.error(`  ❌ Failed to scan ${db.name}: ${err.message}`);
              continue;
            }

            if (candidates.length === 0) {
              console.log(`  ✅ ${db.name}: No images need metadata — all good!`);
              continue;
            }

            // Process ALL candidates — smart auto-scan, no artificial cap.
            // scanImagesWithoutMetadata() already filters out any image that has
            // all three metadata fields (title + tags + category) filled in.
            const toProcess = candidates;
            console.log(`  🚀 Auto-processing all ${toProcess.length} image(s) missing metadata...`);

            for (let i = 0; i < toProcess.length; i++) {
              const { key, record, kind } = toProcess[i];
              console.log(`\n  [${i + 1}/${toProcess.length}] Key: ${key} — ${kindLabel(kind)}`);

              let tmpImagePath = null;
              try {
                tmpImagePath = await imageToTempFile(record, key, kind);
                let metadata = await generateImageMetadata(tmpImagePath, key, geminiPage, kind);
                let check = zedgeEnforce(metadata, 'image');
                if (check.issues.length) {
                  console.warn(`  🚫 [${db.name}] [${key}] Zedge policy: ${check.issues.join('; ')} — regenerating metadata once`);
                  await sleep(2000);
                  metadata = await generateImageMetadata(tmpImagePath, key, geminiPage, kind);
                  check = zedgeEnforce(metadata, 'image');
                }
                const verdict = String(metadata.policy || '').trim();
                const flag = /^FLAG/i.test(verdict) ? verdict.replace(/^FLAG\s*:?\s*/i, '').trim() || 'flagged by policy review' : '';
                const patch = {
                  title: check.meta.title,
                  tags: check.meta.tags,
                  category: check.meta.category,
                  description: check.meta.description,
                  metadataGeneratedAt: Date.now(),
                  policyCheckedAt: Date.now()
                };
                const reason = flag || (check.issues.length ? `metadata could not be made policy-safe: ${check.issues.join('; ')}` : '');
                if (reason && (record.status || 'queued') === 'queued') {
                  // Hold the item: bots only upload status=queued. It appears in the panel/app
                  // Failed section with the reason; Requeue only if it is your own compliant work.
                  Object.assign(patch, {
                    status: 'failed',
                    policyCheck: 'held',
                    policyFlag: reason,
                    error: `Zedge policy hold — ${reason}. Review this item; Requeue only if it is your own original, policy-compliant work (uploading it may suspend the Zedge account).`,
                    failedAt: Date.now()
                  });
                  await firebasePatchMetadata(db.url, IMAGE_QUEUE_PATH, key, patch);
                  console.warn(`  🛑 [${db.name}] [${key}] HELD (not uploaded): ${reason}`);
                  totalHeld++;
                } else {
                  patch.policyCheck = reason ? 'review' : 'passed';
                  if (reason) patch.policyFlag = reason;
                  await firebasePatchMetadata(db.url, IMAGE_QUEUE_PATH, key, patch);
                  console.log(`  ✅ [${db.name}] [${key}] Metadata patched successfully! (policy ${patch.policyCheck})`);
                  totalSuccess++;
                }

              } catch (err) {
                console.error(`  ❌ [${db.name}] [${key}] Failed: ${err.message}`);
                totalFailed++;
              } finally {
                if (tmpImagePath && fs.existsSync(tmpImagePath)) {
                  try { fs.unlinkSync(tmpImagePath); } catch {}
                }
              }

              if (i < toProcess.length - 1) {
                console.log('  ⏳ Waiting 3s before next image...');
                await sleep(3000);
              }
            }
          }

          // ─── SHUTDOWN ─────────────────────────────────────────────────────────────
          if (geminiPage) {
            try {
              const videoPath = await geminiPage.video()?.path();
              if (videoPath) {
                console.log(`\n🎥 Session recording saved: ${videoPath}`);
              }
            } catch (_) {}
          }
          if (geminiBrowser) {
            console.log('\n🌐 Closing Gemini browser...');
            await geminiBrowser.close().catch(() => {});
            // Video file is only fully written after browser closes
            try {
              const videos = fs.readdirSync('/tmp/playwright-videos');
              console.log(`📹 Recording(s) in /tmp/playwright-videos: ${videos.join(', ')}`);
            } catch (_) {}
          }

          // ─── SUMMARY ──────────────────────────────────────────────────────────────
          console.log('\n============================================================');
          console.log('  🏁  IMAGE METADATA GENERATION COMPLETE');
          console.log('============================================================');
          console.log(`✅ Success  : ${totalSuccess}`);
          console.log(`❌ Failed   : ${totalFailed}`);
          console.log(`🛑 Held     : ${totalHeld} (Zedge policy — see Failed section, Requeue only if compliant)`);
          console.log(`⏭️  Already done: images with full metadata were skipped automatically`);
          console.log('============================================================');

          if (totalFailed > 0 && totalSuccess === 0 && !META_LOCAL_DIR) {
            process.exit(1);
          }
          IMGMETA_EOF
          node --check image_metadata.mjs && echo "✅ image_metadata.mjs written ($(wc -l < image_metadata.mjs) lines)"

      - name: 🌩️ Install cloudflared (quick tunnel, no Cloudflare account needed)
        run: |
          curl -fsSL -o /tmp/cloudflared.deb https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb
          sudo dpkg -i /tmp/cloudflared.deb
          sudo apt-get install -y -qq zip > /dev/null
          cloudflared --version


      - name: 📝 Write Image Studio server
        run: |
          cat > studio_server.mjs << 'STUDIO_EOF'
          // ☁️ Image Studio server — runs inside the GitHub Actions runner, exposed via a Cloudflare quick tunnel.
          // Bulk prompts → Cloudinary Image Generation API → 1620×2880 JPGs → (optional) R2 + Firebase distribution.
          import http from 'http';
          import fs from 'fs';
          import path from 'path';
          import { execSync, execFile, spawn } from 'child_process';
          import crypto from 'crypto';
          import zlib from 'zlib';

          // ─── CONFIG ────────────────────────────────────────────────────────────────
          const PORT            = parseInt(process.env.STUDIO_PORT || '8787', 10);
          const TOKEN           = (process.env.STUDIO_TOKEN || crypto.randomBytes(12).toString('hex')).trim();
          const TIMEOUT_MIN     = Math.min(330, Math.max(5, parseInt(process.env.STUDIO_TIMEOUT_MINUTES || '240', 10) || 240)); // GitHub job hard limit is 360 min
          const OUT_DIR         = process.env.STUDIO_OUT_DIR || '/tmp/studio_out';
          const RESULT_FILE     = process.env.STUDIO_RESULT_FILE || '/tmp/studio_result.json';
          const R2_WORKER_URL   = process.env.R2_WORKER_URL || 'https://frosty-pine-2f7dzedge-r2-gateway.holaexplainer.workers.dev'; // <-- CONFIG: your Cloudflare R2 worker URL (same as the ringtone job)
          const METADATA_SCRIPT = process.env.METADATA_SCRIPT || path.resolve('image_metadata.mjs');
          const GEMINI_AVAILABLE = !!((process.env.GEMINI_SESSION_INPUT || '').trim() || (process.env.GEMINI_SESSION || '').trim());
          const META_DIR = process.env.STUDIO_META_DIR || '/tmp/studio_meta';   // job/result hand-off with image_metadata.mjs (local-jobs mode)
          const VALID_IMG_CATS = ['ANIMALS', 'ANIME', 'CARS_N_VEHICLES', 'COMICS', 'DESIGNS', 'DRAWINGS', 'ENTERTAINMENT', 'FUNNY', 'GAMES', 'HOLIDAYS', 'LOVE', 'MUSIC', 'NATURE', 'OTHER', 'PATTERNS', 'PEOPLE', 'SAYINGS', 'SPACE', 'SPIRITUAL', 'SPORTS', 'TECHNOLOGY'];
          const API_BASE        = process.env.STUDIO_API_BASE || 'https://api.cloudinary.com/v2';
          const DELIVERY_BASE   = process.env.STUDIO_DELIVERY_BASE || 'https://res.cloudinary.com';
          const WALL_W = 1620, WALL_H = 2880;

          // <-- CONFIG: your Firebase Realtime Database URLs — MUST be the same as in the ringtone job and image_metadata.mjs above
          const FIREBASE_DB_MAP = {
            zedge_1: 'https://zedgeautomation-default-rtdb.firebaseio.com',
            zedge_2: 'https://zedge-automation-2-default-rtdb.asia-southeast1.firebasedatabase.app',
            zedge_3: 'https://zedge-automation-3-default-rtdb.asia-southeast1.firebasedatabase.app',
            zedge_4: 'https://zedge-4-default-rtdb.asia-southeast1.firebasedatabase.app'
          };

          if (process.env.STUDIO_FIREBASE_MAP_JSON) { try { Object.assign(FIREBASE_DB_MAP, JSON.parse(process.env.STUDIO_FIREBASE_MAP_JSON)); } catch {} }

          const TEXT_MODELS = [
            'nano-banana-1', 'nano-banana-2-lite', 'nano-banana-2',
            'flux-2-klein-9b', 'flux-2-flash', 'flux-2-pro',
            'recraft-v3', 'recraft-v4', 'recraft-v4.1-utility', 'recraft-v4.1-utility-pro',
            'gpt-image-1-mini', 'gpt-image-2', 'gpt-image-2.5-flare', 'gpt-image-2.5-sunburst',
            'ideogram-v4-base', 'ideogram-v4-turbo',
            'muse-image', 'mai-image-2.5',
            'seedream-5-lite', 'seedream-5-pro',
            'grok-imagine-image', 'grok-imagine-image-2.0-low',
            'qwen-image-3'
          ];
          const EDIT_MODELS = [
            'nano-banana-1-edit', 'nano-banana-2-lite-edit', 'nano-banana-2-edit',
            'flux-2-klein-9b-edit', 'flux-2-flash-edit', 'flux-2-pro-edit',
            'recraft-v3-edit',
            'gpt-image-1-mini-edit', 'gpt-image-2-edit', 'gpt-image-2.5-flare-edit', 'gpt-image-2.5-sunburst-edit',
            'muse-image-edit', 'mai-image-2.5-edit',
            'seedream-5-lite-edit', 'seedream-5-pro-edit',
            'grok-imagine-image-edit', 'grok-imagine-image-2.0-low-edit',
