                if (!items.length) throw new Error(skipped ? `${skipped} item(s) have no metadata yet — wait for Gemini or use Edit (Zedge bot skips records without title/tags/category).` : 'Nothing to distribute (only fully generated, not-yet-distributed items are sent).');
