            const m = (req.headers.cookie || '').match(/(?:^|;\s*)sk=([a-f0-9]+)/);
            return m && m[1] === TOKEN ? 'cookie' : false;
          }
          function publicState() {
            return {
              ...state,
              log: state.log.slice(-150),
              items: state.items.map(i => ({ ...i, frames: i.frames.map(f => ({ ...f, localPath: undefined, url: undefined, thumb: f.status === 'done' ? `/files/${encodeURIComponent(i.folder)}/${f.thumbReady ? THUMB_DIR + '/' : ''}${encodeURIComponent(f.file)}` : '', full: f.status === 'done' ? `/files/${encodeURIComponent(i.folder)}/${encodeURIComponent(f.file)}` : '' })) })),
              creds: { ok: hasCreds(), cloud_name: creds.cloud_name, api_key: creds.api_key ? creds.api_key.slice(0, 4) + '…' : '' },
              models: TEXT_MODELS, editModels: EDIT_MODELS, ratios: Object.keys(RATIOS), accounts: [...Object.keys(FIREBASE_DB_MAP), SPREAD], spreadCounts: spreadCounts().counts,
              startedAt, deadline, now: Date.now(), inFlight,
              totals: {
                items: state.items.length,
                frames: state.items.reduce((n, i) => n + i.frames.length, 0),
                framesDone: state.items.reduce((n, i) => n + i.frames.filter(f => f.status === 'done').length, 0),
                itemsDone: state.items.filter(i => i.status === 'done').length,
                distributed: state.items.filter(i => i.distributed.length > 0).length,
                records: state.items.reduce((n, i) => n + i.distributed.length, 0),
                metaReady: state.items.reduce((n, i) => n + i.distributed.filter(d => d.meta && d.meta.title).length, 0),
                metaItems: state.items.filter(i => i.meta && i.meta.title).length,
                metaHeld: state.items.filter(i => i.meta && i.meta.policyCheck === 'held').length,
                metaPending: state.items.filter(i => i.metaStatus === 'queued' || i.metaStatus === 'running' || i.metaStatus === 'retry').length,
                metaRetry: state.items.filter(i => i.metaStatus === 'retry').length,
                metaFailed: state.items.filter(i => i.metaStatus === 'failed').length,
                metaNeeded: state.items.filter(i => i.status === 'done' && !(i.meta && i.meta.title)).length
              },
              categories: VALID_IMG_CATS,
              geminiAvailable: GEMINI_AVAILABLE
            };
          }
          function parsePrompts(body) {
            const text = String(body.text || '').trim();
            if (!text) throw new Error('Paste at least one prompt.');
            const copies = Math.max(1, Math.min(10, parseInt(body.copies, 10) || 1));
            const defType = TYPE_ALIAS[String(body.type || 'SINGLE').toUpperCase().replace(/[\s_]/g, '')] || 'SINGLE';
            let items = null;
            if (/^[\[{]/.test(text)) {
              try { const j = JSON.parse(text); items = Array.isArray(j) ? j : Array.isArray(j.sets) ? j.sets : Array.isArray(j.prompts) ? j.prompts : [j]; } catch (e) { throw new Error('JSON could not be parsed: ' + e.message); }
            }
            if (!items) {
              // one prompt per line; optional "TYPE | concept | prompt" shorthand
              items = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
                const p = l.split('|').map(x => x.trim());
                if (p.length >= 2 && TYPE_ALIAS[p[0].toUpperCase().replace(/[\s_]/g, '')]) return p.length === 2 ? { type: p[0], prompt: p[1] } : { type: p[0], concept: p[1], prompt: p.slice(2).join(' | ') };
