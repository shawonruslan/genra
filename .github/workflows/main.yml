                if (typeof s.autoMetadata === 'boolean') state.settings.autoMetadata = s.autoMetadata;
                if (s.autoFinishMinutes !== undefined) state.settings.autoFinishMinutes = Math.max(0, Math.min(300, parseInt(s.autoFinishMinutes, 10) || 0));
