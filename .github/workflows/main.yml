          background:
          radial-gradient(1100px 520px at 8% -6%,rgba(139,92,246,.16),transparent 62%),
          radial-gradient(950px 520px at 92% -4%,rgba(34,211,238,.11),transparent 62%),
          radial-gradient(800px 620px at 50% 112%,rgba(99,102,241,.09),transparent 60%),
