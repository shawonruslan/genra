          // Brand logo (served at /logo.svg — favicon + panel icon; also used on the 401 page)
          const LOGO_SVG = `<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024"><path fill="#f5f4e8" d="M0 0h1024v1024H0z"/><path fill="#fe4102" d="M749.547 234.206c7.203-.797 16.731-.127 23.688 1.651a62.8 62.8 0 0 1 37.828 28.361c10.46 17.783 8.385 36.29 8.386 56.031l.017 50.469-.03 158.615-.02 140.609-.011 37.604c-.006 11.604.954 25.94-2.065 37.032-17.484 64.482-118.221 59.355-127.653-7.451-1.673-11.845-.747-28-.723-40.267l.153-58.906c.001-16.78 1.265-30.843-7.498-45.961a54.96 54.96 0 0 0-33.846-25.535c-13.786-3.524-50.501-2.578-64.707.272-28.207 5.659-49.278 29.949-56.365 57.391-2.349 12.084-2.007 25.808-2.248 38.156l-.907 48.032c-.124 10.159.253 22.803-1.987 32.51a58.8 58.8 0 0 1-11.613 23.95 63.56 63.56 0 0 1-42.665 22.964c-17.589 1.852-34.751-2.532-48.486-13.875a61.93 61.93 0 0 1-22.567-42.653c-.665-7.276-.111-17.591.03-25.159q.221-17.03.245-34.06c.349-67.503-.817-118.909 45.282-174.417 33.086-39.84 80.38-62.643 131.946-63.422 20.906-.315 42.737.833 63.553-.267 11.355-.601 24.366-5.902 32.846-13.634 21.158-19.293 19.975-37.268 19.983-62.748l-.011-42.638c.001-10.755-.598-26.029 1.746-36.179a58.5 58.5 0 0 1 12.004-24.36c12.135-14.356 27.325-20.568 45.695-22.115"/><path d="M304.965 233.706c17.092.193 32.223 4.016 45.067 15.744 21.139 19.302 19.942 35.578 21.111 61.08 1.175 25.661 5.881 66.171 25.801 83.712 7.713 6.791 16.95 9.605 27.305 8.861 40.524-2.911 44.31-62.445 48.011-93 1.22-10.075 1.054-21.55 3.647-31.478a55.9 55.9 0 0 1 11.463-21.941c23.442-27.466 66.903-30.825 94.19-7.331 19.416 16.715 20.192 34.448 21.976 57.972l2.446 31.628c2.14 26.223 4.968 53.9 6.607 79.998-31.962.462-56.299-1.685-87.843 6.778-53.461 14.345-88.497 45.502-115.955 92.064-3.629 6.644-6.916 12.637-9.702 19.711-26.756-.251-49.923 11.027-58.658 37.872-3.971 12.207-2.863 28.992-2.92 42.037l-.842 84.927c-.139 10.606.673 29.904-1.274 39.558a55.9 55.9 0 0 1-12.238 25.513 65.14 65.14 0 0 1-44.89 22.791c-17.866 1.44-37.473-3.375-51.287-15.162a61.62 61.62 