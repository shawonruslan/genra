          code,kbd{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.25);padding:2px 7px;border-radius:6px;color:#d9ccff}
          ::selection{background:rgba(139,92,246,.4)}
          ::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-track{background:transparent}
          ::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:8px;border:2px solid transparent;background-clip:content-box}
          ::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.22);background-clip:content-box;border:2px solid transparent}
          /* ─── header ─── */
          .top{position:sticky;top:0;z-index:20;background:rgba(6,8,15,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
          .top .in{max-width:1560px;margin:0 auto;padding:14px 28px;display:flex;align-items:center;gap:22px;flex-wrap:wrap}
          .brand{display:flex;align-items:center;gap:14px;margin-right:auto}
          .logo{width:42px;height:42px;border-radius:13px;background:var(--grad);display:grid;place-items:center;position:relative;overflow:hidden;box-shadow:var(--glow);flex:none}
          .logo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),transparent 55%);pointer-events:none}
          .logo img{width:42px;height:42px;display:block;border-radius:13px;position:relative;z-index:1}
          .brand h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.02em;line-height:1.2;background:linear-gradient(180deg,#fff,#c9d4f5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
          .brand small{display:block;font-size:12px;color:var(--muted);font-weight:500;margin-top:2px;-webkit-text-fill-color:var(--muted)}
          .cloud{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--muted);background:var(--raised);border:1px solid var(--line);padding:5px 12px;border-radius:999px;margin-left:10px;vertical-align:2px;-webkit-text-fill-color:var(--muted)}
          .cloud i{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px rgba(52,211,153,.8)}
          .cloud.off i{background:var(--err);box-shadow:0 0 10px rgba(248,113,113,.8)}
          .kpis{display:flex;gap:10px;flex-wrap:wrap}
          .kpi{display:flex;align-items:center;gap:11px;padding:8px 14px 8px 9px;background:var(--surface);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px;min-width:126px;transition:border-color .2s,transform .2s}
          .kpi:hover{border-color:var(--line2);transform:translateY(-1px)}
          .kpi .ring{width:36px;height:36px;flex:none}
          .kpi .ring circle{fill:none;stroke-width:3.5}
          .kpi .ring .bg{stroke:rgba(255,255,255,.08)}
          .kpi .ring .fg{stroke:url(#g1);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
          .kpi .ring.t .fg{stroke:var(--warn)}
          .kpi b{display:block;font-size:15.5px;line-height:1.1;letter-spacing:-.01em;font-weight:750}
          .kpi span{display:block;font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;margin-top:3px;font-weight:600}
          .actions{display:flex;gap:10px}
          /* ─── buttons ─── */
          .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:0 16px;border-radius:12px;border:1px solid transparent;cursor:pointer;font-weight:650;font-size:13.5px;letter-spacing:-.005em;transition:transform .15s ease,box-shadow .25s ease,background .2s,border-color .2s;white-space:nowrap}
          .btn:active{transform:translateY(1px) scale(.99)}.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
          .btn.pri{background:var(--grad);color:#fff;box-shadow:var(--glow),inset 0 1px 0 rgba(255,255,255,.25);text-shadow:0 1px 2px rgba(0,0,0,.2)}
          .btn.pri:hover{box-shadow:0 12px 38px rgba(139,92,246,.5),inset 0 1px 0 rgba(255,255,255,.25);transform:translateY(-1px)}
          .btn.sec{background:var(--raised);color:var(--txt);border-color:var(--line2);backdrop-filter:blur(8px)}
          .btn.sec:hover{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22);transform:translateY(-1px)}
          .btn.warn{background:rgba(251,191,36,.12);color:#fcd34d;border-color:rgba(251,191,36,.35)}
          .btn.warn:hover{background:rgba(251,191,36,.2);transform:translateY(-1px)}
          .btn.danger{background:rgba(248,113,113,.1);color:#fca5a5;border-color:rgba(248,113,113,.3)}
          .btn.danger:hover{background:rgba(248,113,113,.18);transform:translateY(-1px)}
          .btn.hold{background:rgba(248,113,113,.14);color:#fca5a5;border:1px solid rgba(248,113,113,.35)}
          .btn.sm{min-height:33px;padding:0 12px;font-size:12.5px;border-radius:9px}
          .btn.icon{width:34px;padding:0}
          .btn svg{width:15px;height:15px}
          /* ─── layout ─── */
          .wrap{max-width:1560px;margin:0 auto;padding:24px 28px 90px;display:grid;grid-template-columns:410px minmax(0,1fr);gap:22px;align-items:start}
          @media(max-width:1040px){.wrap{grid-template-columns:1fr}.side{position:static!important}}
          .side{position:sticky;top:88px;display:flex;flex-direction:column;gap:18px}
          .card{background:var(--surface);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
          /* ─── tabs ─── */
          .tabs{display:flex;gap:6px;padding:8px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.015);border-radius:var(--r) var(--r) 0 0}
          .tab{flex:1;min-height:40px;border:0;background:transparent;color:var(--muted);border-radius:10px;font-weight:650;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:.2s}
          .tab:hover{color:var(--txt);background:rgba(255,255,255,.05)}
          .tab.on{color:#fff;background:var(--grad);box-shadow:var(--glow)}
          .tab .n{min-width:20px;height:20px;padding:0 5px;border-radius:7px;background:rgba(255,255,255,.1);display:grid;place-items:center;font-size:11px;color:var(--muted);font-weight:700}
          .tab.on .n{background:rgba(255,255,255,.25);color:#fff}
          .pane{display:none;padding:20px;animation:fadeUp .25s ease}.pane.on{display:block}
          @keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
          .pane h3{margin:0 0 5px;font-size:15.5px;letter-spacing:-.015em;font-weight:750}
          .pane p.lead{margin:0 0 15px;color:var(--muted);font-size:13px;line-height:1.5}
          label.l{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:14px 0 7px;font-weight:600;letter-spacing:.02em}label.l:first-child{margin-top:0}
          input,select,textarea{width:100%;background:rgba(0,0,0,.32);border:1px solid var(--line2);color:var(--txt);border-radius:var(--r2);padding:11px 13px;font:inherit;font-size:13.5px;min-height:44px;outline:none;transition:border-color .18s,box-shadow .18s,background .18s}
          input:hover,select:hover,textarea:hover{border-color:rgba(255,255,255,.22)}
          input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3.5px rgba(139,92,246,.25);background:rgba(0,0,0,.45)}
          input::placeholder,textarea::placeholder{color:var(--faint)}
          select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 19px) 50%,calc(100% - 14px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px;cursor:pointer}
          textarea{min-height:190px;resize:vertical;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.6}
          .g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
          /* segmented set-type picker */
          .seg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
          .seg input{display:none}
          .seg label{display:flex;flex-direction:column;align-items:center;gap:3px;padding:11px 6px;border:1px solid var(--line2);border-radius:var(--r2);cursor:pointer;font-size:12.5px;font-weight:650;color:var(--muted);background:rgba(0,0,0,.28);transition:.18s;text-align:center;min-height:58px;justify-content:center}
          .seg label em{font-style:normal;font-size:10.5px;color:var(--faint);font-weight:500}
          .seg label:hover{border-color:rgba(255,255,255,.25);color:var(--txt);transform:translateY(-1px)}
          .seg input:checked+label{border-color:var(--acc);color:#fff;background:linear-gradient(135deg,rgba(139,92,246,.28),rgba(34,211,238,.14));box-shadow:0 0 0 1px var(--acc),0 8px 22px rgba(139,92,246,.25)}
          /* toggle switches */
          .sw{display:flex;align-items:center;gap:13px;padding:12px 0;border-top:1px solid var(--line);cursor:pointer;font-size:13.5px;font-weight:550}
          .sw:first-of-type{border-top:0}.sw span.t{flex:1}.sw span.t small{display:block;color:var(--faint);font-size:11.5px;font-weight:400;margin-top:2px}
          .sw input{display:none}.sw .k{width:42px;height:24px;border-radius:12px;background:rgba(255,255,255,.13);position:relative;transition:.22s;flex:none;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
          .sw .k::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.22s cubic-bezier(.3,1.4,.5,1);box-shadow:0 2px 5px rgba(0,0,0,.4)}
          .sw input:checked+.k{background:var(--grad);box-shadow:0 0 14px rgba(139,92,246,.5)}
          .sw input:checked+.k::after{left:21px}
          .hint{font-size:12px;color:var(--faint);margin-top:9px;line-height:1.55}
          .msg{font-size:12.5px;margin-top:12px;padding:11px 13px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);display:none;line-height:1.5}
          .msg.on{display:block;animation:fadeUp .25s ease}
          .msg.ok{border-color:rgba(52,211,153,.4);color:#a7f3d0;background:rgba(52,211,153,.09)}
          .msg.bad{border-color:rgba(248,113,113,.4);color:#fecaca;background:rgba(248,113,113,.09)}
          .foot{display:flex;gap:10px;align-items:center;margin-top:16px;flex-wrap:wrap}
          .chips{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
          .chip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--raised);border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:.18s}
          .chip:hover{color:#fff;border-color:var(--acc);background:rgba(139,92,246,.18);transform:translateY(-1px)}
          /* ─── collection ─── */
          .col-h{display:flex;align-items:center;gap:14px;padding:18px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap}
          .col-h h2{margin:0;font-size:17px;letter-spacing:-.02em;font-weight:800;display:flex;align-items:center;gap:11px}
          .status{font-size:12.5px;color:var(--muted);font-weight:600;display:inline-flex;align-items:center;gap:7px;background:var(--raised);border:1px solid var(--line);padding:4px 11px;border-radius:999px}
          .status i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
          .status.run i{background:var(--warn);animation:pulse 1.2s infinite;box-shadow:0 0 8px var(--warn)}
          .status.done i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
          .status.paused i{background:var(--acc2);box-shadow:0 0 8px var(--acc2)}
          @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
          .filters{display:flex;gap:4px;margin-left:auto;background:rgba(0,0,0,.3);padding:5px;border-radius:12px;border:1px solid var(--line)}
          .filters button{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:650;padding:6px 12px;border-radius:8px;cursor:pointer;transition:.18s;display:inline-flex;align-items:center;gap:6px}
          .filters button:hover{color:var(--txt)}
          .filters button.on{background:var(--grad);color:#fff;box-shadow:0 4px 14px rgba(139,92,246,.4)}
          .filters button b{opacity:.65;font-weight:700}
          .filters button.on b{opacity:1}
          .progress{height:5px;background:rgba(255,255,255,.06);overflow:hidden}
          .progress i{display:block;height:100%;background:var(--grad);width:0;border-radius:0 3px 3px 0;box-shadow:0 0 12px rgba(139,92,246,.7);transition:width .5s ease}
          .banner{margin:18px 20px 0;padding:15px 17px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:linear-gradient(135deg,rgba(251,191,36,.1),rgba(251,191,36,.04));color:#fde68a;font-size:13px;display:none;line-height:1.55}
          .banner.on{display:block;animation:fadeUp .3s ease}
          .banner b{color:#fff}
          .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:16px;padding:20px}
          @media(max-width:560px){.grid{grid-template-columns:1fr;padding:14px}}
          /* item cards */
          .item{background:rgba(255,255,255,.025);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative;display:flex;flex-direction:column;content-visibility:auto;contain-intrinsic-size:auto 420px;transition:border-color .25s,transform .25s,box-shadow .25s}
          .item:hover{border-color:rgba(139,92,246,.45);transform:translateY(-3px);box-shadow:0 18px 44px rgba(0,0,0,.5),0 0 0 1px rgba(139,92,246,.2)}
          .item.running{border-color:rgba(251,191,36,.6);box-shadow:0 0 0 1px rgba(251,191,36,.25),0 18px 44px rgba(0,0,0,.5)}
          .item.failed,.item.partial{border-color:rgba(248,113,113,.4)}
          .ih{display:flex;align-items:center;gap:11px;padding:14px 16px 11px}
          .idx{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--grad);color:#fff;flex:none;font-variant-numeric:tabular-nums;box-shadow:0 4px 12px rgba(139,92,246,.4)}
          .ttl{flex:1;min-width:0}
          .ttl b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em;font-weight:700}
          .ttl small{display:flex;gap:7px;align-items:center;color:var(--faint);font-size:11.5px;margin-top:3px;flex-wrap:wrap}
          .type{font-size:10px;font-weight:800;letter-spacing:.08em;padding:3px 8px;border-radius:6px;text-transform:uppercase}
          .type.SINGLE{background:rgba(139,92,246,.18);color:#c4b5fd;border:1px solid rgba(139,92,246,.3)}
          .type.T24{background:rgba(251,191,36,.14);color:#fcd34d;border:1px solid rgba(251,191,36,.3)}
          .type.DUAL{background:rgba(34,211,238,.13);color:#67e8f9;border:1px solid rgba(34,211,238,.3)}
          .type.BATTERY{background:rgba(52,211,153,.14);color:#6ee7b7;border:1px solid rgba(52,211,153,.3)}
          .st{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;letter-spacing:.02em}
          .st::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
          .st.queued{background:rgba(255,255,255,.07);color:var(--muted)}
          .st.running{background:rgba(251,191,36,.14);color:#fcd34d}.st.running::before{animation:pulse 1.2s infinite}
          .st.done{background:rgba(52,211,153,.14);color:#6ee7b7}
          .st.failed,.st.partial{background:rgba(248,113,113,.14);color:#fca5a5}
          .st.dist{background:rgba(34,211,238,.13);color:#67e8f9}
          /* distribution block */
          .sent{margin:11px 16px 0;padding:11px 13px;border-radius:12px;background:rgba(255,255,255,.025);border:1px dashed var(--line2);display:flex;gap:9px;align-items:flex-start;flex-wrap:wrap}
          .sent .lbl{font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding-top:6px;min-width:58px}
          .sent .none{font-size:12.5px;color:var(--faint);padding-top:4px}
          .acct{display:inline-flex;flex-direction:column;gap:2px;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:750;border:1px solid transparent;line-height:1.3;transition:transform .15s}
          .acct:hover{transform:translateY(-1px)}
          .acct small{font-weight:500;font-size:10.5px;opacity:.75;font-family:ui-monospace,Menlo,Consolas,monospace}
          .acct.z1{background:rgba(139,92,246,.16);color:#c4b5fd;border-color:rgba(139,92,246,.4)}
          .acct.z2{background:rgba(52,211,153,.14);color:#a7f3d0;border-color:rgba(52,211,153,.4)}
          .acct.z3{background:rgba(251,191,36,.14);color:#fde68a;border-color:rgba(251,191,36,.4)}
          .acct.z4{background:rgba(34,211,238,.13);color:#a5f3fc;border-color:rgba(34,211,238,.4)}
          .acct.pending{background:transparent;color:var(--faint);border-style:dashed;border-color:var(--line2)}
          .acct.err{background:rgba(248,113,113,.12);color:#fca5a5;border-color:rgba(248,113,113,.4)}
          .acct small.fail{color:#fca5a5}.acct small.up{color:#6ee7b7}
          /* metadata block */
          .metab{margin:11px 16px 0;border-radius:12px;border:1px solid var(--line);background:rgba(139,92,246,.045);overflow:hidden}
          .metab .mh{display:flex;align-items:center;gap:9px;padding:9px 13px;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)}
          .metab .mh .sp{flex:1}
          .metab .mh button{min-height:27px;padding:0 10px;font-size:11px;border-radius:7px}
          .metab .mh button svg{width:12px;height:12px}
          .mrow{display:grid;grid-template-columns:88px 1fr;gap:11px;padding:11px 13px;border-top:1px solid var(--line);align-items:start}
          .mrow:first-of-type{border-top:0}
          .mrow .who{display:flex;flex-direction:column;gap:5px}
          .mrow .who .acct{padding:4px 8px;font-size:11.5px}
          .mrow .who .pol{font-size:10px;font-weight:800;letter-spacing:.04em;padding:3px 7px;border-radius:6px;text-align:center;text-transform:uppercase}
          .pol.passed{background:rgba(52,211,153,.16);color:#6ee7b7}
          .pol.review{background:rgba(251,191,36,.16);color:#fcd34d}
          .pol.held{background:rgba(248,113,113,.16);color:#fca5a5}
          .pol.wait{background:rgba(255,255,255,.07);color:var(--faint)}
          .mrow .body{min-width:0}
          .mrow .body .t{font-size:13.5px;font-weight:750;color:var(--txt);display:flex;gap:9px;align-items:center;flex-wrap:wrap;letter-spacing:-.01em}
          .mrow .body .t .cat{font-size:10px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:6px;background:rgba(34,211,238,.15);color:#67e8f9;text-transform:uppercase}
          .mrow .body .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
          .mrow .body .d.open{display:block}
          .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
          .tags span{font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;background:rgba(139,92,246,.1);color:#c4b5fd;border:1px solid rgba(139,92,246,.22);transition:.15s}
          .tags span:hover{background:rgba(139,92,246,.22);color:#fff}
          .mrow .wait{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:9px;line-height:1.5}
          .mrow .wait i{width:8px;height:8px;border-radius:50%;background:var(--warn);animation:pulse 1.2s infinite;display:inline-block;flex:none}
          .mrow .flag{font-size:11.5px;color:#fca5a5;margin-top:5px}
          .ms{font-size:10.5px;font-weight:750;padding:3px 8px;border-radius:6px;letter-spacing:.04em;display:inline-flex;align-items:center;gap:6px}
          .ms.done,.ms.manual{background:rgba(52,211,153,.16);color:#6ee7b7}
          .ms.held{background:rgba(248,113,113,.16);color:#fca5a5}
          .ms.failed{background:rgba(248,113,113,.16);color:#fca5a5}
          .ms.queued,.ms.running{background:rgba(167,139,250,.18);color:#d8ccff}
          .ms.retry{background:rgba(251,191,36,.16);color:#fcd34d}
          .ms.none{background:rgba(255,255,255,.07);color:var(--faint)}
          .ms i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
          .ms.running i{animation:pulse 1.2s infinite}
          .mbody{padding:11px 13px}
          .mbody .t{font-size:14px;font-weight:750;color:var(--txt);display:flex;gap:9px;align-items:center;flex-wrap:wrap;letter-spacing:-.01em}
          .mbody .t .cat{font-size:10px;font-weight:800;letter-spacing:.07em;padding:3px 8px;border-radius:6px;background:rgba(34,211,238,.15);color:#67e8f9;text-transform:uppercase}
          .mbody .d{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}
          .mbody .tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
          .mbody .tags span{font-size:11px;padding:3px 9px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--muted)}
          .mbody .flag{font-size:12px;color:#fca5a5;margin-top:7px;padding:7px 9px;border-radius:8px;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.28)}
          .mbody .wait{font-size:12.5px;color:var(--faint);display:flex;align-items:center;gap:9px;line-height:1.5}
          .mbody .wait i{width:8px;height:8px;border-radius:50%;background:var(--violet);animation:pulse 1.2s infinite;display:inline-block;flex:none}
          .mbody .src{font-size:11px;color:var(--faint);margin-top:7px}
          .medit{display:grid;grid-template-columns:1fr 150px;gap:9px;padding:12px 13px}
          .medit label{display:flex;flex-direction:column;gap:5px;font-size:10.5px;color:var(--faint);font-weight:700;letter-spacing:.05em;text-transform:uppercase;position:relative}
          .medit input,.medit select,.medit textarea{background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--txt);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px;min-height:36px;text-transform:none;letter-spacing:0}
          .medit input:focus,.medit select:focus,.medit textarea:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(139,92,246,.22)}
          .medit textarea{min-height:52px;resize:vertical}
          .medit .full{grid-column:1/-1}
          .medit .cnt{position:absolute;right:2px;top:0;font-weight:400;text-transform:none;letter-spacing:0}
          .medit .acts{grid-column:1/-1;display:flex;gap:9px;align-items:center;justify-content:flex-end}
          .medit .acts small{margin-right:auto;color:var(--faint);font-size:11.5px;text-transform:none;letter-spacing:0;font-weight:400}
          /* metadata worker pill + account filter */
          .mw{display:inline-flex;align-items:center;gap:9px;font-size:12px;font-weight:600;color:var(--muted);background:var(--raised);border:1px solid var(--line);padding:6px 12px;border-radius:999px;max-width:440px}
          .mw i{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
          .mw.run i{background:var(--violet);animation:pulse 1.2s infinite;box-shadow:0 0 8px var(--violet)}
          .mw.ok i{background:var(--ok);box-shadow:0 0 8px var(--ok)}
          .mw.off i{background:var(--err)}
          .mw.err i{background:var(--err);box-shadow:0 0 8px var(--err)}
          .mw b{color:var(--txt);font-weight:650}.mw .cur{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:220px}
          .acctsum{display:flex;gap:7px;flex-wrap:wrap;padding:12px 20px 0;align-items:center}
          .acctsum .lbl{font-size:10.5px;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;font-weight:800;margin-right:3px}
          .acctsum button{border:1px solid var(--line);background:var(--raised);color:var(--muted);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:650;cursor:pointer;display:inline-flex;gap:7px;align-items:center;transition:.18s}
          .acctsum button:hover{color:#fff;border-color:var(--line2);transform:translateY(-1px)}
          .acctsum button i{width:8px;height:8px;border-radius:50%;display:inline-block}
          .acctsum button.z1 i{background:#8b5cf6;box-shadow:0 0 6px #8b5cf6}
          .acctsum button.z2 i{background:#34d399;box-shadow:0 0 6px #34d399}
          .acctsum button.z3 i{background:#fbbf24;box-shadow:0 0 6px #fbbf24}
          .acctsum button.z4 i{background:#22d3ee;box-shadow:0 0 6px #22d3ee}
          .acctsum button.meta i{background:var(--violet);box-shadow:0 0 6px var(--violet)}
          .acctsum button.held i{background:var(--err);box-shadow:0 0 6px var(--err)}
          .acctsum button b{color:var(--txt)}
          .acctsum button.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(139,92,246,.4)}
          .acctsum button.on b{color:#fff}
          .acctsum button.none{opacity:.5}
          /* frame strips */
          .ring2{width:32px;height:32px;flex:none}
          .ring2 circle{fill:none;stroke-width:3}
          .ring2 .bg{stroke:rgba(255,255,255,.08)}
          .ring2 .fg{stroke:var(--ok);stroke-linecap:round;transition:stroke-dashoffset .5s}
          .strip{display:grid;gap:8px;padding:2px 16px 0;grid-template-columns:repeat(4,1fr)}
          .strip[data-n="6"]{grid-template-columns:repeat(6,1fr)}
          .strip .beside{grid-column:span 3;display:flex;flex-direction:column;gap:9px;min-width:0;padding:3px 0 3px 8px}
          .strip[data-n="2"] .beside{grid-column:span 2}
          .strip .beside .prompt{padding:0;-webkit-line-clamp:5}
          .strip .beside .meta2{font-size:11.5px;color:var(--faint);display:flex;gap:7px;flex-wrap:wrap;margin-top:auto}
          .fr{position:relative;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.4);aspect-ratio:9/16;border:1px solid var(--line);transition:transform .2s,border-color .2s,box-shadow .2s}
          .fr:hover{transform:scale(1.02);border-color:rgba(139,92,246,.5);box-shadow:0 10px 28px rgba(0,0,0,.5);z-index:2}
          .fr.sq{aspect-ratio:1}.fr.land{aspect-ratio:16/9}
          .fr img{width:100%;height:100%;object-fit:cover;display:block;cursor:zoom-in}
          .fr .cap{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font-size:10.5px;font-weight:600;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.8));pointer-events:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
          .fr .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;color:var(--faint);text-align:center;padding:8px}
          .fr.running{border-color:rgba(251,191,36,.5)}
          .fr.running .ph{color:#fcd34d}
          .fr.failed{border-color:rgba(248,113,113,.5)}.fr.failed .ph{color:#fca5a5}
          .fr .re{position:absolute;top:6px;right:6px;width:28px;height:28px;border-radius:9px;border:0;background:rgba(0,0,0,.75);backdrop-filter:blur(6px);color:#fff;cursor:pointer;display:grid;place-items:center;opacity:0;transition:.18s;border:1px solid rgba(255,255,255,.15)}
          .fr:hover .re,.fr.failed .re{opacity:1}
          .fr .re:hover{background:var(--acc);transform:rotate(-40deg)}
          .fr .re svg{width:14px;height:14px}
          .prompt{padding:11px 16px 0;font-size:12.5px;color:var(--muted);line-height:1.55;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
          .prompt:hover{color:var(--txt)}
          .prompt.open{display:block}
          .err{margin:9px 16px 0;font-size:12px;color:#fca5a5;background:rgba(248,113,113,.09);border:1px solid rgba(248,113,113,.3);border-radius:9px;padding:8px 11px;word-break:break-word;line-height:1.5}
          .er{color:#fca5a5}
          .if{display:flex;align-items:center;gap:9px;padding:13px 16px;margin-top:auto}
          .if .meta{flex:1;display:flex;gap:7px;flex-wrap:wrap;font-size:11.5px;color:var(--faint);align-items:center}
          .if .meta code{font-size:11px}
          /* item action buttons */
          .acts{display:flex;gap:7px;align-items:center}
          .acts .btn{box-shadow:none}
          /* empty state */
          .empty{padding:80px 26px;text-align:center;color:var(--muted)}
          .empty .phones{display:flex;justify-content:center;gap:12px;margin-bottom:26px}
          .empty .phones i{width:48px;height:86px;border-radius:12px;border:1px solid var(--line2);background:linear-gradient(135deg,rgba(139,92,246,.2),rgba(34,211,238,.08));position:relative;animation:float 3.2s ease-in-out infinite}
          .empty .phones i:nth-child(2){animation-delay:.4s}.empty .phones i:nth-child(3){animation-delay:.8s}.empty .phones i:nth-child(4){animation-delay:1.2s}
          .empty .phones i::before{content:"";position:absolute;top:7px;left:50%;transform:translateX(-50%);width:15px;height:3px;border-radius:2px;background:rgba(255,255,255,.3)}
          @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
          .empty h4{margin:0 0 8px;font-size:17px;color:var(--txt);font-weight:750;letter-spacing:-.01em}
          .empty p{margin:0;font-size:13px;max-width:440px;margin-inline:auto;line-height:1.6}
          /* ─── console ─── */
          .console{position:fixed;left:0;right:0;bottom:0;z-index:15;background:rgba(6,8,15,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line2);transform:translateY(calc(100% - 42px));transition:transform .25s cubic-bezier(.3,.9,.3,1)}
          .console.open{transform:none;box-shadow:0 -20px 60px rgba(0,0,0,.5)}
          .console .bar{height:42px;display:flex;align-items:center;gap:13px;padding:0 26px;cursor:pointer;user-select:none;font-size:12.5px;color:var(--muted)}
          .console .bar:hover{color:var(--txt)}
          .console .bar b{color:var(--txt);font-weight:700}
          .console .bar .last{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;color:var(--faint)}
          .console .bar .dot{width:9px;height:9px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
          .console .bar #consoleHint{font-size:11px;color:var(--faint);font-weight:700}
          .console pre{margin:0;height:250px;overflow:auto;padding:8px 26px 18px;font:12px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#c3cbe0;white-space:pre-wrap}
          .console pre .ok{color:#6ee7b7}.console pre .er{color:#fca5a5}.console pre .wn{color:#fcd34d}.console pre .in{color:#67e8f9}.console pre .ts{color:var(--faint)}
          /* ─── lightbox / toast ─── */
          .lb{position:fixed;inset:0;z-index:50;background:rgba(4,6,10,.94);backdrop-filter:blur(10px);display:none;place-items:center;padding:26px;cursor:zoom-out}
          .lb.on{display:grid;animation:fadeUp .25s ease}
          .lb img{max-width:min(94vw,580px);max-height:92vh;border-radius:16px;box-shadow:0 30px 90px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.12)}
          .lb .cap{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:var(--muted);font-size:13px}
          .toasts{position:fixed;top:84px;right:26px;z-index:60;display:flex;flex-direction:column;gap:9px;pointer-events:none}
          .toast{background:rgba(20,24,36,.92);backdrop-filter:blur(14px);border:1px solid var(--line2);color:var(--txt);padding:12px 16px;border-radius:13px;font-size:13px;max-width:370px;box-shadow:var(--shadow);animation:toastIn .3s cubic-bezier(.2,.9,.3,1.2)}
          @keyframes toastIn{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:none}}
          .toast.bad{border-color:rgba(248,113,113,.5);box-shadow:0 12px 40px rgba(248,113,113,.2)}
          .toast.good{border-color:rgba(52,211,153,.5);box-shadow:0 12px 40px rgba(52,211,153,.2)}
          .done-banner{margin:18px 20px 0;padding:17px 19px;border-radius:15px;background:linear-gradient(135deg,rgba(52,211,153,.14),rgba(34,211,238,.07));border:1px solid rgba(52,211,153,.4);color:#d1fae5;font-size:13.5px;display:none;line-height:1.55}
          .done-banner.on{display:block;animation:fadeUp .35s ease}
          .done-banner b{display:block;font-size:15.5px;margin-bottom:5px;color:#fff;font-weight:750}
          /* pager */
          .pager{display:flex;align-items:center;gap:9px;padding:2px 20px 16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
          .pager button{border:1px solid var(--line);background:var(--raised);color:var(--txt);border-radius:9px;min-width:34px;height:32px;padding:0 11px;font:inherit;font-size:12.5px;font-weight:650;cursor:pointer;transition:.18s}
          .pager button:hover:not(:disabled){border-color:var(--acc);color:#fff}
          .pager button:disabled{opacity:.35;cursor:default}
          .pager select{width:auto;min-height:32px;height:32px;padding:0 30px 0 11px;font-size:12.5px;border-radius:9px;background-position:calc(100% - 15px) 50%,calc(100% - 10px) 50%}
          .pager .sp{flex:1}.pager b{color:var(--txt)}
          .item{content-visibility:auto;contain-intrinsic-size:420px}
          /* review / misc states */
          .review{border-color:rgba(251,191,36,.4)}
          .cnt{font-variant-numeric:tabular-nums}
          .cur{font-weight:600}
          .dist{color:var(--acc2)}
          .paused{opacity:.85}
          .good{color:var(--ok)}.bad{color:var(--err)}.warn{color:var(--warn)}
          .passed{color:var(--ok)}.failed{color:var(--err)}
          .pending{color:var(--faint)}.running{color:var(--warn)}
          .manual{color:var(--violet)}
          .full{width:100%}
          .sq{border-radius:12px}.land{border-radius:12px}
          .ph{color:var(--faint)}
          .icon{display:inline-grid;place-items:center}
          .n{font-variant-numeric:tabular-nums}
          .k{font-weight:650}
          .who{font-size:12px}
          .z1{--zc:#8b5cf6}.z2{--zc:#34d399}.z3{--zc:#fbbf24}.z4{--zc:#22d3ee}
          @media(max-width:1500px){.brand small{display:none}.kpi{min-width:108px;padding:8px 11px 8px 9px}}
          @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
          @media(max-width:640px){
          .top .in{padding:11px 15px;gap:11px}.wrap{padding:15px 15px 90px}
          .kpis{width:100%;order:3;display:grid;grid-template-columns:1fr 1fr;gap:9px}
          .kpi{min-width:0;padding:9px 11px}.kpi b{font-size:14px}.kpi span{font-size:10px;white-space:normal;line-height:1.25}
          .actions{margin-left:auto}.brand small{display:none}
          .console .bar,.console pre{padding-left:15px;padding-right:15px}
          .strip[data-n="6"]{grid-template-columns:repeat(3,1fr)}
          .medit{grid-template-columns:1fr}
          .g2,.g3{grid-template-columns:1fr}
          .seg{grid-template-columns:repeat(2,1fr)}}
          
          </style></head><body>
          <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6d8cff"/><stop offset="1" stop-color="#38d6ff"/></linearGradient></defs></svg>
          <header class="top"><div class="in">
           <div class="brand"><div class="logo"><img src="/logo.svg" alt="logo"></div>
            <div><h1>Image Studio <span class="cloud off" id="credPill"><i></i><span id="credTxt">no credentials</span></span></h1><small>Runs on the GitHub runner · exposed through Cloudflare tunnel</small></div></div>
           <div class="kpis">
            <div class="kpi"><svg class="ring" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" id="rFrames" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="94.2"/></svg><div><b id="tFrames">0 / 0</b><span>frames</span></div></div>
            <div class="kpi"><div style="width:34px;height:34px;border-radius:9px;background:rgba(109,140,255,.15);display:grid;place-items:center;color:#b4c4ff;font-weight:700;font-size:13px" id="tItems">0</div><div><b id="tItemsDone">0 done</b><span>items</span></div></div>
            <div class="kpi"><div style="width:34px;height:34px;border-radius:9px;background:rgba(56,214,255,.14);display:grid;place-items:center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9de9ff" stroke-width="2.2" stroke-linecap="round"><path d="M12 3c3 4 5 6.5 5 9.5a5 5 0 0 1-10 0c0-1.6.6-3 1.6-4.4.3 1.2 1 2 1.9 2.4C10.8 8.6 11.6 5.6 12 3z"/></svg></div><div><b id="tDist">0</b><span>distributed</span></div></div>
            <div class="kpi"><svg class="ring" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" id="rMeta" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="94.2" style="stroke:var(--violet)"/></svg><div><b id="tMeta">0 / 0</b><span>metadata</span></div></div>
            <div class="kpi"><svg class="ring t" viewBox="0 0 36 36"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" id="rTime" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="0"/></svg><div><b id="tLeft">–</b><span>session left</span></div></div>
           </div>
           <div class="actions">
            <button class="btn sec sm" id="pauseBtn" title="Pause / resume the generation queue"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg><span>Pause</span></button>
            <a class="btn sec sm" href="/api/zip" title="Download everything generated so far"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>ZIP</a>
            <button class="btn danger sm" id="finishBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4"/><path d="M5 4h12l-2 4 2 4H5"/></svg>Finish session</button>
           </div>
          </div></header>

          <main class="wrap">
          <aside class="side">
           <section class="card">
            <nav class="tabs" role="tablist">
             <button class="tab on" data-pane="pPrompts"><span class="n">1</span>Prompts</button>
             <button class="tab" data-pane="pGen"><span class="n">2</span>Generate</button>
             <button class="tab" data-pane="pDist"><span class="n">3</span>Distribute</button>
             <button class="tab" data-pane="pCred"><span class="n">4</span>Keys</button>
            </nav>
            <div class="pane on" id="pPrompts">
             <h3>Bulk prompts</h3><p class="lead">One prompt per line. Every line becomes a set or a single wallpaper and starts generating immediately.</p>
             <label class="l">Set type for plain lines</label>
             <div class="seg">
              <input type="radio" name="ptype" id="ty1" value="SINGLE" checked><label for="ty1">Single<em>1 frame</em></label>
              <input type="radio" name="ptype" id="ty2" value="24-HOUR"><label for="ty2">24‑Hour<em>4 frames</em></label>
              <input type="radio" name="ptype" id="ty3" value="DUAL"><label for="ty3">Dual<em>lock + home</em></label>
              <input type="radio" name="ptype" id="ty4" value="BATTERY"><label for="ty4">Battery<em>6 frames</em></label>
             </div>
             <label class="l"><span>Prompts</span><span id="lineCount">0 lines</span></label>
             <textarea id="ptext" spellcheck="false" placeholder="Neon koi fish gliding through a glowing cyber pond, bioluminescent lilies
          BATTERY | Crystal Heart | A floating crystal heart with veins of light
          24H | Misty Peak | A lone mountain peak rising above a sea of clouds"></textarea>
             <div class="chips"><span class="chip" data-ins="TYPE | concept | prompt">TYPE | concept | prompt</span><span class="chip" data-ins='[{"type":"24-HOUR","concept":"Misty Peak","prompt":"…","model":"flux-2-pro"}]'>JSON import</span><span class="chip" id="clearPrompts">Clear</span></div>
             <div class="g2" style="margin-top:12px;align-items:end">
              <div><label class="l">Copies per prompt</label><input id="copies" type="number" min="1" max="10" value="1"></div>
              <button class="btn pri" id="addBtn" style="min-height:42px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add &amp; generate</button>
             </div>
             <div class="msg" id="addMsg"></div>
             <p class="hint">Shortcut: <kbd>Ctrl</kbd>+<kbd>Enter</kbd> adds the queue. Power cut? The runner keeps generating — just reopen this link.</p>
            </div>
            <div class="pane" id="pGen">
             <h3>Generation defaults</h3><p class="lead">Applied to new items. JSON lines can override model, res, boost, display, strength, ratio, upscale.</p>
             <label class="l">Model</label><select id="model"></select>
             <div class="g3" style="margin-top:12px">
              <div><label class="l">Resolution</label><select id="res"><option value="1K">1K · faster</option><option value="2K">2K · best</option></select></div>
              <div><label class="l">Ratio <small>(single)</small></label><select id="ratio"></select></div>
              <div><label class="l">Parallel</label><select id="concurrency"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
             </div>
             <div class="g3" style="margin-top:12px">
              <div><label class="l">Color boost</label><select id="boost"><option value="off">Off · natural</option><option value="soft">Soft glow</option><option value="vivid">Vivid pop</option><option value="neon">Neon luxe</option><option value="ultra">Ultra impact</option></select></div>
              <div><label class="l">Display</label><select id="display"><option value="any">Any phone</option><option value="amoled">AMOLED</option><option value="lcd">LCD</option></select></div>
              <div><label class="l">Variation</label><select id="strength"><option value="subtle">Subtle</option><option value="clear">Clear</option><option value="strong">Strong</option></select></div>
             </div>
             <div style="margin-top:12px">
              <label class="l">24‑Hour look</label><select id="sceneVary"><option value="on">Same scene · each hour gets its own sky, weather &amp; atmosphere</option><option value="off">Same scene · relight only (no weather change)</option></select>
              <p class="lead" style="margin-top:6px">Subject, place, background and camera stay locked across all four frames — only the time of day changes. Every render is checked: an almost‑black frame or a near‑copy of the morning frame is re‑rendered automatically.</p>
             </div>
             <div style="margin-top:14px">
              <label class="sw"><span class="t">AI upscale before crop<small><code>e_upscale</code> → 1620 × 2880 · slower but sharper</small></span><input type="checkbox" id="upscale"><span class="k"></span></label>
             </div>
             <div style="margin-top:12px">
              <label class="l">Crop</label><select id="crop"><option value="center">Centre crop · same on every frame (recommended)</option><option value="smart">Smart crop <code>g_auto</code> · content‑aware, can shift per frame</option></select>
              <p class="lead" style="margin-top:6px">The studio now measures what the model actually delivered: if it is already the requested ratio, the frame is only resized and <b>nothing is cut off</b>. A crop is used only when the ratio really differs — centre keeps the same strip on every frame of a set, while smart <code>g_auto</code> picks a different window per image (that is what shifted the subject left on one frame and right on the next).</p>
             </div>
             <div class="foot"><button class="btn pri" data-save>Save defaults</button><span class="hint" style="margin:0" id="saveMsg1"></span></div>
            </div>
            <div class="pane" id="pDist">
             <h3>Distribution</h3><p class="lead">Completed items get Gemini‑Web metadata first, then are uploaded to R2 and queued in Firebase <b>with</b> title / tags / category — each item to exactly one account.</p>
             <div class="g2"><div><label class="l">Target account</label><select id="target"></select></div><div><label class="l">Queue path</label><input id="queuePath"></div></div>
             <div id="spreadBox" style="margin-top:8px;display:none"><label class="l">Spread across (each item → a different account, balanced)</label><div id="spreadPool" style="display:flex;gap:8px;flex-wrap:wrap;margin-top:4px"></div></div>
             <div class="hint" style="font-size:12px;color:var(--muted);margin-top:6px;line-height:1.45">🔒 <b style="color:var(--txt)">One image / set → one Zedge account, always.</b> Choose <b>spread</b> to hand out a big batch: set 1 → zedge_1, set 2 → zedge_2, … (least-loaded account first) — every account gets <i>different</i> files, none gets a file that another account already has. Once distributed, an item is locked to that account (no re-send, no “all accounts”, no frame regeneration). A SHA‑256 ledger also refuses any byte‑identical file that was ever uploaded to any account. Want the same concept in another account? Add the prompt again — it renders a different image.</div>
             <div style="margin-top:14px">
              <label class="sw"><span class="t">Auto‑distribute<small>Send each item as soon as all of its frames are done</small></span><input type="checkbox" id="autoDistribute"><span class="k"></span></label>
              <label class="sw"><span class="t">Gemini metadata before distribute<small>As soon as a set / image is rendered, Gemini Web writes title · tags · category · description + Zedge policy check (same script as <code>metadata</code> mode)</small></span><input type="checkbox" id="autoMetadata"><span class="k"></span></label>
              <div class="g2" style="margin-bottom:10px"><div><label class="l">Auto‑retry failed metadata</label><select id="metaAutoRetry"><option value="0">off</option><option value="2">2 retries</option><option value="4">4 retries (45 s → 2 → 5 → 10 min)</option><option value="6">6 retries</option></select></div><div><label class="l">&nbsp;</label><div style="font-size:12px;color:var(--muted);line-height:1.45">Retries are spaced with growing back‑off + jitter; the Gemini worker runs one image at a time and cools down after 3 failures in a row — no bursts, no time‑outs.</div></div></div>
              <label class="sw"><span class="t">Require metadata to distribute<small>Records are pushed to Firebase <b>with</b> metadata, exactly like the ringtone job — the Zedge bot never sees a “metadata missing” file. Turn off only if you want the old behaviour (push first, patch later).</small></span><input type="checkbox" id="requireMetadata"><span class="k"></span></label>
              <label class="sw"><span class="t">Final metadata pass after finish<small>Safety net: after the session the Firebase scan runs once for anything still missing title / tags / category</small></span><input type="checkbox" id="runMetadata"><span class="k"></span></label>
             </div>
             <label class="l"><span>Auto‑finish after idle</span><span>minutes · 0 = manual only</span></label><input id="autoFinish" type="number" min="0" max="300">
             <p class="hint">Loadshedding mode: turn on auto‑distribute + an idle timer, paste prompts, and walk away. The session finishes itself and hands off to metadata.</p>
             <div class="foot"><button class="btn pri" data-save>Save distribution</button><span class="hint" style="margin:0" id="saveMsg2"></span></div>
            </div>
            <div class="pane" id="pCred">
             <h3>Cloudinary keys</h3><p class="lead" id="credHint"></p>
             <label class="l">Cloud name</label><input id="c_cloud" autocomplete="off" placeholder="my-cloud">
             <div class="g2" style="margin-top:12px"><div><label class="l">API key</label><input id="c_key" autocomplete="off" placeholder="1234567890"></div><div><label class="l">API secret</label><input id="c_secret" type="password" autocomplete="new-password" placeholder="••••••••"></div></div>
             <p class="hint">Keys live only in this runner's memory for the session. Tip: add <code>CLOUDINARY_CLOUD_NAME / API_KEY / API_SECRET</code> repo secrets to skip this step.</p>
             <div class="foot"><button class="btn pri" data-save>Save keys</button><span class="hint" style="margin:0" id="saveMsg3"></span></div>
            </div>
           </section>
          </aside>

          <section class="card" id="collection">
           <div class="col-h">
            <h2>Collection <span class="status" id="status"><i></i><span>idle</span></span></h2>
            <div class="filters" id="filters"><button class="on" data-f="all">All<b id="fAll">0</b></button><button data-f="running">Active<b id="fRun">0</b></button><button data-f="done">Done<b id="fDone">0</b></button><button data-f="failed">Failed<b id="fFail">0</b></button><button data-f="dist">Sent<b id="fDist">0</b></button></div>
            <button class="btn sec sm" id="distAllBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>Distribute all completed</button>
           </div>
           <div class="progress"><i id="bar"></i></div>
           <div class="acctsum" id="acctsum"></div>
           <div class="acctsum" style="padding-top:8px"><span class="mw" id="mw"><i></i><span id="mwTxt">metadata worker idle</span></span><button class="btn sec sm" id="metaRunBtn" title="Queue every finished item that still has no metadata for Gemini Web">🧠 Generate metadata <b id="metaNeed" style="margin-left:4px"></b></button><button class="btn sec sm icon" id="metaRefreshBtn" title="Re-read record status from Firebase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 6.7 16.7"/><path d="M20 5v6h-6"/></svg></button></div>
           <div class="done-banner" id="finishedBox"></div>
           <div class="banner" id="credBanner">⚠ Add your Cloudinary keys in <b>Keys</b> — queued items start as soon as they are saved.</div>
           <div class="banner" id="quotaBanner">⛔ <b>Cloudinary generation limit exceeded</b> (MG_00602) — this Cloudinary account has used up its AI image-generation quota. The queue is paused, nothing is marked failed. Upgrade the plan at <a href="https://console.cloudinary.com/app/image/generation/plans" target="_blank" style="color:inherit">console.cloudinary.com → Image Generation → Plans</a>, or enter the keys of another Cloudinary cloud in <b>Keys</b>; then press <b>Resume</b>.</div>
           <div class="grid" id="items"></div>
           <div class="pager" id="pager"></div>
           <div class="empty" id="empty"><div class="phones"><i></i><i></i><i></i><i></i></div><h4>Nothing in the collection yet</h4><p>Paste prompts on the left — singles, 24‑hour, dual or battery sets — and watch them render here frame by frame.</p></div>
          </section>
          </main>

          <div class="console" id="console"><div class="bar" id="consoleBar"><span class="dot"></span><b>Console</b><span class="last" id="lastLog">waiting for the runner…</span><span id="consoleHint">▲ open</span></div><pre id="log"></pre></div>
          <div class="lb" id="lb"><img id="lbImg" alt=""><div class="cap" id="lbCap"></div></div>
          <div class="toasts" id="toasts"></div>

          <script>
          const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
          const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
          const RE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11A8 8 0 1 0 6.7 16.7"/><path d="M20 5v6h-6"/></svg>';
          const PEN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
          let S=null,inited=false,filter='all',openPrompts=new Set(),editId=null,page=0,pageSize=+(localStorage.getItem('pageSize')||24),ver=null;const cardSig=new Map();
          function toast(m,k){const t=document.createElement('div');t.className='toast'+(k?' '+k:'');t.textContent=m;$('#toasts').appendChild(t);setTimeout(()=>{t.style.opacity=0;t.style.transition='.3s';setTimeout(()=>t.remove(),300)},3200)}
          async function api(p,b){const r=await fetch(p,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b||{})});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||('HTTP '+r.status));return d}
          const fmtLeft=ms=>{const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);return h?\`\${h}h \${String(m).padStart(2,'0')}m\`:\`\${m}m\`};
          const ring=(el,frac)=>{el.style.strokeDashoffset=(94.2*(1-Math.max(0,Math.min(1,frac)))).toFixed(1)};
          const typeCls=t=>t==='24-HOUR'?'T24':t;
          const accts=()=>S?S.accounts.filter(a=>a!=='spread'):[];const acls=a=>'z'+String(a).replace(/\\D/g,'');
          const fmtT=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
          const targetsOf=t=>[t];
          function sentRow(i){
           const cur=$('#target')?$('#target').value:S.settings.targetAccount;
           const sentTo=new Set(i.distributed.map(d=>d.dbName));
           if(!i.distributed.length&&i.distributeStatus!=='running'&&!i.distributeError) return \`<div class="sent"><span class="lbl">Sent to</span><span class="none">Not distributed yet\${i.status==='done'?\` · target: <b style="color:var(--txt)">\${cur==='spread'?'spread (next free account)':esc(cur)}</b>\`:''}</span></div>\`;
           const badges=i.distributed.map(d=>{const st=d.meta&&d.meta.status||'';const cls=st==='failed'?' fail':st&&st!=='queued'?' up':'';return \`<span class="acct \${acls(d.dbName)}" title="Firebase key \${esc(d.key)} · \${new Date(d.at).toLocaleString()}\${d.meta&&d.meta.error?' · '+esc(d.meta.error):''}">\${esc(d.dbName)}<small class="\${cls.trim()}">\${esc(d.key)} · \${fmtT(d.at)}\${st?' · '+esc(st)+(d.meta.policyCheck==='held'?' (held)':''):''}</small></span>\`}).join('');
           const pending=i.distributeStatus==='running'?targetsOf(i.lockedAccount||cur).filter(a=>!sentTo.has(a)&&a!=='spread').map(a=>\`<span class="acct pending">\${esc(a)}<small>uploading…</small></span>\`).join(''):'';
           const failed=i.distributeError&&i.distributeStatus!=='running'?i.distributeError.split(' · ').map(x=>{const m=x.match(/^(zedge_\\d)/);return m&&!sentTo.has(m[1])?\`<span class="acct err" title="\${esc(x)}">\${esc(m[1])}<small>failed</small></span>\`:''}).join(''):'';
           return \`<div class="sent"><span class="lbl">Sent to</span>\${badges}\${pending}\${failed}</div>\`}
          const tagList=t=>Array.isArray(t)?t:String(t||'').split(/[,;]+/).map(x=>x.trim()).filter(Boolean);
          const MS={queued:'queued for Gemini',running:'Gemini is writing…',retry:'auto‑retry scheduled',done:'✓ Gemini Web',manual:'manual ✓',held:'🛑 policy hold',failed:'✗ failed'};
          function metaBlock(i){
           if(i.status!=='done') return '';
           const mw=S.metaWorker,m=i.meta,st=i.metaStatus||(m?'done':'none');
           const chip=\`<span class="ms \${st}">\${st==='running'||st==='queued'?'<i></i>':''}\${MS[st]||'no metadata'}</span>\`;
           const canRedo=mw.available&&st!=='queued'&&st!=='running'&&st!=='retry';
           const head=\`<div class="mh">🧠 Zedge metadata \${chip}<span class="sp"></span>\${editId===i.id?'':\`<button class="btn sec sm" onclick="editMeta(\${i.id})" title="Type / fix title, tags, category yourself">\${PEN} Edit</button>\`}\${canRedo?\`<button class="btn sec sm" onclick="redoMeta(\${i.id})" title="Ask Gemini Web again\${i.distributed.length?' and patch every sent record':''}">\${RE} Redo</button>\`:''}</div>\`;
           if(editId===i.id){const f=m||{title:i.metadata.title,tags:(i.metadata.tags||[]).join(', '),category:i.metadata.category,description:i.metadata.description};
            return \`<div class="metab">\${head}<form class="medit" onsubmit="saveMeta(event,\${i.id})">
             <label>Title <span class="cnt" id="ttlCnt\${i.id}">\${String(f.title||'').length}/25</span><input name="title" maxlength="25" value="\${esc(f.title)}" oninput="$('#ttlCnt\${i.id}').textContent=this.value.length+'/25'" required></label>
             <label>Category<select name="category">\${S.categories.map(c=>\`<option\${c===f.category?' selected':''}>\${c}</option>\`).join('')}</select></label>
             <label class="full">Tags (2–10, comma separated)<input name="tags" value="\${esc(tagList(f.tags).join(', '))}" required></label>
             <label class="full">Description (max 5 words)<input name="description" maxlength="120" value="\${esc(f.description||'')}"></label>
             <div class="acts"><small>\${i.distributed.length?\`Saving patches \${i.distributed.length} Firebase record(s)\${m&&m.policyCheck==='held'?' and re-queues the held item':''}\`:'Saved metadata is pushed together with the record'}</small><button type="button" class="btn sec sm" onclick="cancelEdit()">Cancel</button><button class="btn pri sm">Save metadata</button></div></form></div>\`}
           let body;
           if(m&&m.title) body=\`<div class="mbody"><div class="t">\${esc(m.title)}<span class="cat">\${esc(m.category)}</span></div>\${m.description?\`<div class="d">\${esc(m.description)}</div>\`:''}<div class="tags">\${tagList(m.tags).map(t=>\`<span>\${esc(t)}</span>\`).join('')}</div>\${m.policyFlag?\`<div class="flag">🛑 Zedge policy: \${esc(m.policyFlag)} — pushed as <b>status failed / held</b>; fix with Edit (re-queues) or Redo.</div>\`:''}</div>\`;
           else if(st==='queued') body=\`<div class="mbody"><div class="wait"><i></i>\${mw.running&&mw.ready?'queued — Gemini is busy with another image':mw.running?'waiting — Gemini Web is opening…':mw.error?\`worker stopped: \${esc(mw.error)} · use Edit\`:'waiting for the metadata worker'}</div></div>\`;
           else if(st==='running') body=\`<div class="mbody"><div class="wait"><i></i>Gemini Web is looking at this image and writing title · tags · category…</div></div>\`;
           else if(st==='retry') body=\`<div class="mbody"><div class="wait"><i style="background:var(--warn)"></i>attempt \${i.metaAttempts||1} failed (\${esc(String(i.metaError||'').slice(0,90))}) — Gemini will retry automatically at <b>\${fmtT(i.metaRetryAt)}</b></div></div>\`;
           else if(st==='failed') body=\`<div class="mbody"><div class="flag">✗ \${esc(i.metaError||'metadata failed')}\${i.metaAttempts>1?\` (after \${i.metaAttempts} attempts)\`:''} — press Redo or Edit.</div></div>\`;
           else body=\`<div class="mbody"><div class="wait">\${!mw.available?'GEMINI_SESSION missing — type the metadata with Edit (records without it are skipped by the Zedge bot).':S.settings.autoMetadata?'no metadata yet — press 🧠 Generate metadata or Edit':'auto metadata is off — press 🧠 Generate metadata or Edit'}</div></div>\`;
           return \`<div class="metab">\${head}\${body}</div>\`}
          function distBtn(i){
           const cur=$('#target')?$('#target').value:S.settings.targetAccount;
           if(i.distributeStatus==='running') return \`<button class="btn sec sm" disabled>Distributing → \${esc(i.lockedAccount||cur)}…</button>\`;
           const tl=cur==='spread'?'next account (spread)':cur;
           if(i.distributed.length) return \`<button class="btn sec sm" disabled title="One image/set = one Zedge account. Locked to \${esc(i.distributed[0].dbName)} — it can never be sent to another account.">🔒 Only in \${esc(i.distributed[0].dbName)}</button>\`;
           const hasMeta=!!(i.meta&&i.meta.title);
           if(S.settings.requireMetadata&&!hasMeta) return \`<button class="btn sec sm" onclick="dist(\${i.id})" title="Records without title/tags/category are skipped by the Zedge bot — waiting for Gemini, or press Edit">⏳ Metadata first → \${esc(tl)}</button>\`;
           if(hasMeta&&i.meta.policyCheck==='held') return \`<button class="btn hold sm" onclick="dist(\${i.id},true)" title="Pushed as status failed / policyCheck held — review in the app before requeue">🛑 Distribute held → \${esc(tl)}</button>\`;
           return \`<button class="btn pri sm" onclick="dist(\${i.id})" title="Send to \${esc(tl)} only — this locks the item to that account">Distribute → \${esc(tl)}</button>\`}const fmtB=b=>b>=1048576?(b/1048576).toFixed(1)+' MB':Math.round(b/1024)+' KB';
          const setMsg=(el,txt,cls)=>{el.textContent=txt;el.className='msg on '+(cls||'')};

          /* tabs */
          $$('.tab').forEach(b=>b.onclick=()=>{$$('.tab').forEach(x=>x.classList.toggle('on',x===b));$$('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.pane))});
          /* prompt helpers */
          const lines=()=>$('#ptext').value.split('\\n').map(l=>l.trim()).filter(Boolean).length;
          $('#ptext').addEventListener('input',()=>{$('#lineCount').textContent=lines()+' line'+(lines()===1?'':'s')});
          $('#ptext').addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='Enter'){e.preventDefault();$('#addBtn').click()}});
          $$('.chip[data-ins]').forEach(c=>c.onclick=()=>{const t=$('#ptext');t.value=(t.value.trim()?t.value.replace(/\\s*$/,'\\n'):'')+c.dataset.ins;t.dispatchEvent(new Event('input'));t.focus()});
          $('#clearPrompts').onclick=()=>{$('#ptext').value='';$('#ptext').dispatchEvent(new Event('input'))};

          function fillSettings(){const s=S.settings;
           $('#model').innerHTML=S.models.map(m=>\`<option\${m===s.model?' selected':''}>\${m}</option>\`).join('');
           $('#ratio').innerHTML=S.ratios.map(r=>\`<option\${r===s.ratio?' selected':''}>\${r}</option>\`).join('');
           $('#target').innerHTML=S.accounts.map(a=>\`<option value="\${a}"\${a===s.targetAccount?' selected':''}>\${a==='spread'?'spread — each item to a different account':a}</option>\`).join('');
           $('#spreadPool').innerHTML=accts().map(a=>\`<label class="chip" style="cursor:pointer;display:inline-flex;gap:6px;align-items:center"><input type="checkbox" class="sp" value="\${a}"\${(s.spreadPool||accts()).includes(a)?' checked':''}>\${a} <b style="color:var(--faint)">\${(S.spreadCounts||{})[a]??0}</b></label>\`).join('');$('#spreadBox').style.display=$('#target').value==='spread'?'':'none';
           $('#res').value=s.res;$('#concurrency').value=s.concurrency;$('#boost').value=s.boost;$('#display').value=s.display;$('#strength').value=s.strength;$('#sceneVary').value=s.sceneVary||'on';$('#upscale').checked=s.upscale;$('#crop').value=s.crop||'center';
           $('#queuePath').value=s.queuePath;$('#autoDistribute').checked=s.autoDistribute;$('#requireMetadata').checked=s.requireMetadata;$('#metaAutoRetry').value=String(s.metaAutoRetry??4);$('#runMetadata').checked=s.runMetadata;$('#autoMetadata').checked=s.autoMetadata;$('#autoFinish').value=s.autoFinishMinutes;$('#c_cloud').value=S.creds.cloud_name||''}

          function itemCard(i){
           const done=i.frames.filter(f=>f.status==='done').length,n=i.frames.length;
           const shape=i.type==='SINGLE'&&i.settings.ratio!=='9:16'?(i.settings.ratio==='1:1'?' sq':(i.settings.ratio==='16:9'||i.settings.ratio==='4:3')?' land':''):'';
           const frames=i.frames.map((f,k)=>\`<div class="fr \${f.status}\${f.companion?' sq':shape}" title="\${esc(f.name)}\${f.error?' — '+esc(f.error):''}\${f.warn?' — ⚠ '+esc(f.warn):''}">\${f.status==='done'?\`<img src="\${f.thumb}" loading="lazy" decoding="async" alt="\${esc(f.file)}" onclick="lb('\${f.full||f.thumb}','\${esc(i.folder)} · \${esc(f.file)}')">\`:\`<div class="ph">\${f.status==='running'?'rendering…':f.status==='failed'?'failed':'queued'}</div>\`}\${i.status!=='running'&&!i.distributed.length?\`<button class="re" title="Regenerate \${esc(f.name)}" onclick="retry(\${i.id},\${k})">\${RE}</button>\`:''}<div class="cap">\${f.warn?'⚠ ':''}\${esc(f.name)}</div></div>\`).join('');
           const dist=i.distributed.length?\`<span class="st dist">🔒 \${esc(i.distributed[0].dbName)} only</span>\`:'';const mst=i.status==='done'&&i.meta&&i.meta.title?\`<span class="st dist" style="color:\${i.meta.policyCheck==='held'?'#ffb3b3':'#9ef0c6'}">\${i.meta.policyCheck==='held'?'🛑 held':'🧠 meta ✓'}</span>\`:'';
           const busyDist='';
           return \`<article class="item \${i.status}" data-id="\${i.id}">
            <div class="ih"><div class="idx">\${String(i.index).padStart(2,'0')}</div><div class="ttl"><b title="\${esc(i.folder)}">\${esc(i.concept)}</b><small><span class="type \${typeCls(i.type)}">\${i.type}</span><span>\${esc(i.settings.model)}</span><span>· \${i.settings.res}\${i.type==='SINGLE'?' · '+i.settings.ratio:''}</span></small></div>
             <svg class="ring2" viewBox="0 0 36 36" title="\${done}/\${n}"><circle class="bg" cx="18" cy="18" r="15"/><circle class="fg" cx="18" cy="18" r="15" stroke-dasharray="94.2" stroke-dashoffset="\${(94.2*(1-done/n)).toFixed(1)}" style="\${i.status==='failed'||i.status==='partial'?'stroke:var(--err)':i.status==='running'?'stroke:var(--warn)':''}"/></svg></div>
            \${n<4?\`<div class="strip" data-n="\${n}">\${frames}<div class="beside"><div class="prompt \${openPrompts.has(i.id)?'open':''}" onclick="togglePrompt(\${i.id})">\${esc(i.prompt)}</div><div class="meta2"><span>\${n===1?'1 frame':n+' frames'}</span><span>· \${fmtB(i.frames.reduce((a,f)=>a+(f.size||0),0))}</span></div></div></div>\`
            :\`<div class="strip" data-n="\${n}">\${frames}</div><div class="prompt \${openPrompts.has(i.id)?'open':''}" onclick="togglePrompt(\${i.id})">\${esc(i.prompt)}</div>\`}
            \${i.error?\`<div class="err">\${esc(i.error)}</div>\`:''}\${i.distributeError&&i.distributeStatus!=='running'?\`<div class="err">Distribute · \${esc(i.distributeError)}</div>\`:''}
            \${(i.status==='done'||i.distributed.length)?sentRow(i):''}
            \${metaBlock(i)}
            <div class="if"><div class="meta"><span class="st \${i.status}">\${i.status} · \${done}/\${n}</span>\${mst}\${dist}\${busyDist}</div>
             \${i.status==='done'?distBtn(i):''}
             \${(i.status==='failed'||i.status==='partial')?\`<button class="btn warn sm" onclick="retry(\${i.id})">\${RE}Retry failed</button>\`:''}
             \${i.status!=='running'?\`<button class="btn sec sm icon" title="Remove" onclick="del(\${i.id})"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>\`:''}
            </div></article>\`}

