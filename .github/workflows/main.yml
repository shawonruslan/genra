            if (item.metaStatus === 'queued' || item.metaStatus === 'running') return true;
            if (why !== 'retry') item.metaAttempts = 0;
            const attempt = (item.metaAttempts || 0) + 1;
            const job = { id: String(item.id), imagePath: anchor.localPath, kind: SET_FRAMES[item.type].contentType, folder: item.folder, queuedAt: Date.now(), attempt };
            fs.writeFileSync(path.join(META_JOBS, `${item.id}.json`), JSON.stringify(job));
            item.metaStatus = 'queued'; item.metaError = ''; item.metaAttempts = attempt; item.metaRetryAt = 0;
