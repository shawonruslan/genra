                  else { item.frames.forEach((f, i) => { if (i > which && f.status === 'done') f.status = 'queued'; }); }
                  if (which === 0 && item.frames.length > 1) log(`⟳ ${item.folder}: anchor regenerated — all variants re-queued to stay consistent`);
                  else if (item.frames.length > which + 1) log(`⟳ ${item.folder}: frame ${which + 1} regenerated — downstream frames re-queued to follow the chain`);
                } else {
