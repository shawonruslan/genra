            const base = st.model, editModel = EDIT_MODELS.includes(toEdit(base)) ? toEdit(base) : 'nano-banana-2-edit';
            const grade = grading(st);
            const rules = (item.type === 'SINGLE' && st.ratio !== '9:16') ? BASE_RULES_FREE : BASE_RULES;
            const S = STRENGTH[st.strength] || STRENGTH.clear;
            const is24 = item.type === '24-HOUR';
            // v27.15 - the companion is always asked for as 1:1 and delivered as exactly 2000x2000
            const isCompanion = !!fdef.companion;
            const genRatio = isCompanion ? '1:1' : (st.ratio || '9:16');
            const outRatio = isCompanion ? 'SQ2000' : (st.ratio || '9:16');
            const voidRule = is24 ? (fdef.slot === 'night' ? NO_VOID_NIGHT : NO_VOID) : '';
            const buildPrompt = fix => { const atmo = (item.scenePlan && item.scenePlan[fdef.slot]) || '';
              if (isCompanion) return [item.prompt ? 'Concept: ' + item.prompt : '', SQUARE_COMPANION, grade, fix].filter(Boolean).join('\n\n');
              return (isAnchor
              ? [item.prompt, def.design, fdef.instr, atmo && 'ATMOSPHERE FOR THIS FRAME — ' + atmo, voidRule, grade, rules, fix]
              : [item.prompt ? 'Concept: ' + item.prompt : '', is24 ? TIME_LOCK : S.lock, is24 ? TIME_PUSH : S.push,
                 'STATE TO RENDER — ' + fdef.instr, atmo && 'ATMOSPHERE FOR THIS FRAME — ' + atmo, voidRule, NO_DUPE, grade, rules, fix]
            ).filter(Boolean).join('\n\n'); };
            frame.status = 'running'; frame.error = ''; frame.warn = ''; saveState();
            let lastErr = null, fixHint = '';
            for (let attempt = 1; attempt <= 4; attempt++) {
              if (attempt === 4 && !fixHint) break;                 // 4th try only exists for a quality re-render
              frame.attempts++;
              const prompt = buildPrompt(fixHint);
              try {
                const payload = {
                  prompt,
                  model: { id: isAnchor ? base : editModel },
                  image_size: { aspect_ratio: genRatio, resolution: st.res || '2K' },
                  format: 'png',
                  target: { target_type: 'managed_asset', public_id: `zedge/${item.folder}/${fdef.file.replace(/\.jpg$/, '')}_${Date.now().toString(36)}` }
                };
                if (!isAnchor) payload.reference_images = [{ source_type: 'managed_asset', asset_id: prevFrame.assetId }];
                const asset = await cloudinaryGenerate(isAnchor ? 'text_to_image' : 'image_to_image', payload);
                frame.assetId = asset.storage.asset_id;
                if (isAnchor) item.anchorId = asset.storage.asset_id;
                const src = await sourceSize(asset.storage);
                const url = derivedUrl(asset.storage, st.upscale, outRatio, isCompanion ? 'center' : st.crop, src);
                if (src) {
                  const [tw, th] = outRatio === 'SQ2000' ? [2000, 2000] : (RATIOS[outRatio] || RATIOS['9:16']);
                  const srcAr = src.w / src.h, tgtAr = tw / th;
                  const off = Math.abs(srcAr - tgtAr) / tgtAr;
                  if (off <= 0.02) { if (isAnchor) log(`📐 ${item.folder}: model delivered ${src.w}×${src.h} (${genRatio}) — resized only, nothing cropped`); }
                  else {
                    const wide = srcAr > tgtAr;
                    const lost = 1 - (wide ? tgtAr / srcAr : srcAr / tgtAr);
                    log(`✂️ ${item.folder}/${fdef.file}: model returned ${src.w}×${src.h}, so ${Math.round(lost * 100)}% of the ${wide ? 'width' : 'height'} must be cropped to reach ${isCompanion ? '1:1 2000×2000' : genRatio} (centre crop — same strip on every frame).`);
                  }
                }
                const buf = await downloadDerived(url);
                const dir = path.join(OUT_DIR, item.folder); fs.mkdirSync(dir, { recursive: true });
                const localPath = path.join(dir, fdef.file);
                fs.writeFileSync(localPath, buf);
                // Quality gate for time-of-day sets: the render must keep the scene (not a black void)
                // and must actually look like a different hour than the morning anchor.
                const qc = isCompanion ? null : await qcFrame(item, f, fdef, localPath);   // v27.15 - the square companion has no time/energy state to check
                if (qc && attempt < 4) {
                  fixHint = qc.fix;
                  log(`🔍 ${item.folder}/${fdef.file}: ${qc.msg} — re-rendering`);
                  if (is24 && qc.kind !== 'drift') { item.scenePlan = buildScenePlan(item, fdef.slot); }
                  lastErr = new Error(qc.msg);
                  await sleep(1200);
                  continue;
                }
                if (qc) { frame.warn = qc.msg; log(`⚠️ ${item.folder}/${fdef.file}: ${qc.msg} — keeping the last render`); }
                frame.url = url; frame.localPath = localPath; frame.size = buf.length; frame.status = 'done'; frame.error = '';
                makeThumb(item, frame);
                log(`✅ ${item.folder}/${fdef.file} (${(buf.length / 1024).toFixed(0)} KB)`);
                saveState();
                return true;
              } catch (err) {
                lastErr = err;
                // Cloudinary AI-generation quota exhausted (MG_00602 "Generation limit exceeded") → retrying is pointless.
                // Pause the whole queue once, keep the remaining frames QUEUED (not failed) so they resume after new keys / upgrade.
                if (/generation limit exceeded|MG_00602|quota|rate limit exceeded|402/i.test(err.message)) {
                  if (!state.quotaHit) { state.quotaHit = err.message; state.paused = true; log(`⛔ Cloudinary generation limit reached — queue paused. Upgrade the plan or enter another cloud's keys (Keys tab), then press Resume + Retry failed. (${err.message.slice(0, 120)})`); }
                  frame.status = 'queued'; frame.error = err.message; saveState();
                  return false;
                }
                log(`⚠️ ${item.folder}/${fdef.file} attempt ${attempt}: ${err.message}`);
                if (attempt < 3) await sleep(2000 * attempt);
              }
            }
            frame.status = 'failed'; frame.error = lastErr ? lastErr.message : 'failed';
            saveState();
            return false;
          }

          // Panel thumbnails (≈300 px wide, q70) — with 200–300 sets the browser would otherwise decode
          // thousands of 1620×2880 JPGs and freeze. Uses ImageMagick (present on GitHub runners); falls back to the full file.
          const THUMB_DIR = '.thumbs';
          let thumbTool = null;
          for (const t of ['magick', 'convert']) { try { execSync(`${t} -version`, { stdio: 'ignore' }); thumbTool = t; break; } catch {} }
          // ─── FRAME QUALITY GATE (24-HOUR sets) ─────────────────────────────────────
          // Two failure modes we saw in production: (a) the edit model drops the whole environment and
          // returns the subject on bare black, (b) it returns a near copy of the anchor. Both are checked
          // on the rendered pixels with ImageMagick and trigger one corrective re-render.
          const execFileP = (cmd, args) => new Promise(r => execFile(cmd, args, { timeout: 30000 }, (err, stdout) => r(err ? null : String(stdout).trim())));
          async function meanLuma(file) {
            const out = await execFileP(thumbTool, [file, '-resize', '64x114!', '-colorspace', 'Gray', '-format', '%[fx:mean]', 'info:']);
            const v = parseFloat(out); return Number.isFinite(v) ? v : null;
          }
          async function sceneDelta(a, b) {
            const out = await execFileP(thumbTool, [a, b, '-resize', '64x114!', '-metric', 'RMSE', '-compare', '-format', '%[distortion]', 'info:']);
            const v = parseFloat(out); return Number.isFinite(v) ? v : null;
          }
          async function qcFrame(item, idx, fdef, localPath) {
            if (item.type !== '24-HOUR' || !thumbTool) return null;
            try {
              const lum = await meanLuma(localPath);
              const min = MIN_LUMA[fdef.slot];
              if (lum !== null && min !== undefined && lum < min) return { kind: 'dark', fix: DARK_FIX, msg: `scene lost — almost black for ${fdef.slot} (brightness ${lum.toFixed(3)} < ${min})` };
              if (idx > 0 && fdef.slot !== 'night') {
                // Chained QC: "same" is measured against the chain predecessor (each step
                // must visibly advance from the frame it was derived from); "drift" is
                // measured against the anchor so the scene can't wander off over the chain.
                const prev = item.frames[idx - 1].localPath;
                if (prev && fs.existsSync(prev)) {
                  const d = await sceneDelta(prev, localPath);
                  if (d !== null && d < 0.045) return { kind: 'same', fix: SAME_FIX, msg: `too close to the previous frame (Δ ${d.toFixed(3)})` };
                }
                const anchor = item.frames[0].localPath;
                if (anchor && fs.existsSync(anchor)) {
                  const d = await sceneDelta(anchor, localPath);
                  if (d !== null && d > 0.70) return { kind: 'drift', fix: DRIFT_FIX, msg: `scene drifted from the morning frame (Δ ${d.toFixed(3)})` };
                }
              }
            } catch { return null; }
            return null;
          }
          function makeThumb(item, frame) {
            if (!thumbTool) return;
            const dir = path.join(OUT_DIR, item.folder, THUMB_DIR); fs.mkdirSync(dir, { recursive: true });
            const out = path.join(dir, frame.file);
            execFile(thumbTool, [frame.localPath, '-resize', '300x540>', '-quality', '72', '-strip', out], { timeout: 30000 }, err => {
              if (err) { log(`⚠️ thumbnail failed for ${item.folder}/${frame.file}: ${err.message.slice(0, 80)}`); return; }
              frame.thumbReady = true; saveState();
            });
          }
          function itemStatusFromFrames(item) {
            const done = item.frames.filter(f => f.status === 'done').length;
            if (done === item.frames.length) return 'done';
            if (item.frames.some(f => f.status === 'running')) return 'running';
            return done > 0 ? 'partial' : 'failed';
          }

          async function processItem(item) {
            item.status = 'running'; item.error = ''; lastActivity = Date.now(); saveState();
            log(`🎨 Generating ${item.folder} (${item.frames.length} frame${item.frames.length === 1 ? '' : 's'}) · ${item.settings.model}`);
            // Anchor first (text_to_image); then each frame chains SEQUENTIALLY from the
            // previous frame's image (image-to-image), like the Flutter app's set chaining.
            const anchorOk = item.frames[0].status === 'done' || await generateFrame(item, 0);
            if (anchorOk && item.frames.length > 1) {
              for (let i = 1; i < item.frames.length; i++) {
                if (item.frames[i].status === 'done') continue;
                const ok = await generateFrame(item, i);
                if (!ok) {
                  // Chain broken: downstream frames have no reference image.
                  for (let j = i + 1; j < item.frames.length; j++) {
                    const d = item.frames[j];
                    if (d.status !== 'done') { d.status = 'failed'; d.error = 'blocked — a previous frame in the chain failed'; }
                  }
                  break;
                }
              }
            }
            item.status = itemStatusFromFrames(item);
            // v27.15 - the 1:1 foldable companion is OPTIONAL: if only it failed, the SINGLE still counts as done.
            const bad = item.frames.filter(f => f.status !== 'done');
            if (item.status !== 'done' && bad.length && bad.every(f => f.companion)) {
              bad.forEach(f => { f.status = 'skipped'; f.error = f.error || 'companion skipped'; });
              item.status = 'done';
              log(`⚠️ ${item.folder}: the 1:1 foldable companion could not be rendered — the portrait wallpaper is kept (companion is optional)`);
            }
            if (state.quotaHit && item.status !== 'done' && item.frames.some(f => f.status === 'queued')) { item.status = 'queued'; item.error = 'waiting — Cloudinary generation limit'; }
            else if (item.status !== 'done') item.error = item.frames.filter(f => f.status === 'failed').map(f => `${f.file}: ${f.error}`).join(' · ');
            lastActivity = Date.now(); saveState();
            if (item.status === 'done') {
              // Same order as the ringtone job: metadata FIRST (Gemini Web), then the Firebase record.
              if (!(item.meta && item.meta.title)) queueMetadata(item, 'generated');
              maybeAutoDistribute(item);
            }
          }

          let inFlight = 0;
          let pumping = false;
          async function pump() {
            if (pumping) return; pumping = true;
            try {
              while (!state.finished && !state.paused && hasCreds()) {
                const limit = Math.max(1, Math.min(4, parseInt(state.settings.concurrency, 10) || 1));
                if (inFlight >= limit) break;
                const next = state.items.find(i => i.status === 'queued');
                if (!next) break;
                inFlight++;
                processItem(next).catch(e => { next.status = 'failed'; next.error = e.message; saveState(); }).finally(() => { inFlight--; pump(); });
              }
            } finally { pumping = false; }
          }

          // ─── DISTRIBUTION: Cloudinary JPG → R2 → Firebase (same schema as the panel / ringtone job) ──
          // ⚠️ ONE ITEM → ONE ZEDGE ACCOUNT, ALWAYS. The same image/set in two Zedge accounts = duplicate content = suspension.
          // There is deliberately NO "all accounts" target here, and the ledger below makes a second send impossible.
          // target "spread" = DISTRIBUTE THE COLLECTION ACROSS THE ACCOUNTS: every item still goes to exactly ONE
          // account, but consecutive items are spread round-robin over settings.spreadPool (least-loaded first),
          // so zedge_1..4 each receive different sets / images and never the same file.
          const SPREAD = 'spread';
          function spreadCounts() {
            const pool = (state.settings.spreadPool || []).filter(a => FIREBASE_DB_MAP[a]);
            const counts = Object.fromEntries(pool.map(a => [a, 0]));
            for (const it of state.items) { const a = it.lockedAccount || (it.distributed[0] && it.distributed[0].dbName); if (a && a in counts) counts[a]++; }
            return { pool, counts };
          }
          let spreadCursor = 0;
          function pickSpreadAccount() {
            const { pool, counts } = spreadCounts();
            if (!pool.length) throw new Error('Spread: no accounts selected in "Spread across" — tick at least one account.');
            const min = Math.min(...pool.map(a => counts[a]));
            const candidates = pool.filter(a => counts[a] === min);
            const pick = candidates[spreadCursor % candidates.length]; spreadCursor++;
            return pick;
          }
          function resolveTarget(target) {
            const t = String(target || state.settings.targetAccount || 'zedge_2').toLowerCase();
            return t === SPREAD ? pickSpreadAccount() : t;
          }
          function targetDbs(target) {
            const t = String(target || state.settings.targetAccount || 'zedge_2').toLowerCase();
            if (t === 'all_accounts' || t === 'all_four' || t === 'all_three') throw new Error('Sending one image/set to several Zedge accounts is blocked (duplicate content → account suspension). Pick one account, or "spread" to give each item to a different account.');
            if (t === SPREAD) throw new Error('internal: resolve "spread" to one account first');
            if (FIREBASE_DB_MAP[t]) return [{ name: t, url: FIREBASE_DB_MAP[t] }];
            throw new Error(`Unknown target account "${target}"`);
          }
          async function uploadToR2(buffer, fileName, dbName) {
            const cleaned = fileName.replace(/[^a-zA-Z0-9._-]/g, '_');
            const key = `${String(dbName).replace(/^zedge_?/i, 'zedge')}/wallpaper/${Date.now()}_${cleaned}`;
            const res = await fetch(R2_WORKER_URL, { method: 'POST', headers: { 'X-File-Name': key, 'X-File-Type': 'image/jpeg' }, body: buffer }).catch(e => { throw netErr('R2 worker unreachable', e); });
            if (!res.ok) throw new Error(`R2 upload failed (HTTP ${res.status}): ${(await res.text().catch(() => '')).slice(0, 200)}`);
            const data = await res.json().catch(() => ({}));
            if (!data.url) throw new Error(`R2 worker response missing 'url': ${JSON.stringify(data).slice(0, 200)}`);
            return data.url;
          }
          const netErr = (what, e) => new Error(`${what}: ${e.message}${e.cause && e.cause.message ? ' (' + e.cause.message + ')' : ''}`);
          async function firebasePush(dbUrl, queuePath, data) {
            const res = await fetch(`${dbUrl}/${queuePath}.json`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) }).catch(e => { throw netErr('Firebase unreachable', e); });
            if (!res.ok) throw new Error(`Firebase push failed (${res.status}): ${(await res.text().catch(() => '')).slice(0, 200)}`);
            return (await res.json()).name;
          }
          // ─── DUPLICATE-CONTENT LEDGER (survives the whole session, also written to the artifact) ──
          // sha256 of every JPG that was ever uploaded → { account, firebaseKey, folder, at }. Before any
          // upload we check every frame of the item: if ANY byte-identical file was already sent to ANY
          // account (same or different) the distribution is refused. Nothing is uploaded partially.
          const LEDGER_FILE = path.join(OUT_DIR, 'distribution_ledger.json');
          let ledger = {};
          try { ledger = JSON.parse(fs.readFileSync(LEDGER_FILE, 'utf8')); } catch { ledger = {}; }
          const sha256 = buf => crypto.createHash('sha256').update(buf).digest('hex');
          function saveLedger() { try { fs.writeFileSync(LEDGER_FILE, JSON.stringify(ledger, null, 2)); } catch (e) { console.error('ledger save failed', e.message); } }
          function assertNotSentBefore(item, target) {
            try { assertNotSentBeforeInner(item, target); } catch (e) { log(`🚫 BLOCKED (duplicate-content guard): ${e.message}`); throw e; }
          }
          function assertNotSentBeforeInner(item, target) {
            // 1) item-level lock: an item that already has a Firebase record anywhere can never be sent again
            if (item.distributed.length) {
              const acct = item.distributed[0].dbName;
              throw new Error(`${item.folder} is already in ${acct} (key ${item.distributed[0].key}). One image/set goes to ONE Zedge account only — sending it to ${target === acct ? 'the same account again' : target} would be duplicate content and can get the account suspended.`);
            }
            if (item.lockedAccount && item.lockedAccount !== target) throw new Error(`${item.folder} is locked to ${item.lockedAccount}.`);
            // 2) file-level lock: byte-identical frames must never exist in two records / two R2 folders
            for (const fr of item.frames) {
              if (!fr.localPath) continue;                       // v27.15 - skipped optional companion
              const h = sha256(fs.readFileSync(fr.localPath));
              const hit = ledger[h];
              if (hit) throw new Error(`${item.folder}/${fr.file} is byte-identical to a file already uploaded to ${hit.account} (${hit.folder}, key ${hit.firebaseKey}). Refused — duplicate content across Zedge accounts.`);
            }
          }
          async function distributeItem(item, target, opts = {}) {
            if (item.status !== 'done') throw new Error('item is not fully generated');
            if (item.distributeStatus === 'running') return;
            const resolved = item.lockedAccount && !item.distributed.length ? item.lockedAccount : resolveTarget(target);   // "spread" → one concrete account
            const [{ name: onlyAccount }] = targetDbs(resolved);
            assertNotSentBefore(item, onlyAccount);
            if (String(target).toLowerCase() === SPREAD) log(`🔀 spread: ${item.folder} → ${onlyAccount}`);
            const hasMeta = !!(item.meta && item.meta.title && item.meta.tags && item.meta.category);
            if (state.settings.requireMetadata && !hasMeta && !opts.force) {
              if (state.metaWorker.error && !state.metaWorker.running) throw new Error(`${item.folder}: Gemini worker stopped — ${state.metaWorker.error}. Press Edit and type title / tags / category, or re-export GEMINI_SESSION and start the workflow again.`);
              if (item.metaStatus === 'retry') throw new Error(`${item.folder}: metadata failed once (${item.metaError || 'Gemini error'}) — auto-retry at ${new Date(item.metaRetryAt).toTimeString().slice(0, 5)}. Wait, or press Edit.`);
              if (item.metaStatus === 'queued' || item.metaStatus === 'running') throw new Error(`${item.folder}: Gemini metadata is still being written — the record is sent as soon as it is ready. (Or press Edit and type title / tags / category yourself.)`);
              if (item.metaStatus === 'failed') throw new Error(`${item.folder}: metadata failed (${item.metaError || 'Gemini error'}). Press Redo or Edit it manually before distributing.`);
              throw new Error(`${item.folder}: no metadata yet — ${state.metaWorker.available ? 'press 🧠 Generate metadata or Edit it manually' : 'GEMINI_SESSION is missing, so type title / tags / category with Edit'}. Records without metadata are skipped by the Zedge bot.`);
            }
            item.distributeStatus = 'running'; item.distributeError = ''; item.lockedAccount = onlyAccount; saveState();
            const dbs = targetDbs(onlyAccount);      // always exactly one account
            if (dbs.length !== 1 || FIREBASE_DB_MAP[dbs[0].name] !== dbs[0].url) throw new Error('internal: account routing mismatch — aborted');
            const def = SET_FRAMES[item.type];
            const [w, h] = RATIOS[item.settings.ratio] || RATIOS['9:16'];
            const queuePath = state.settings.queuePath || 'wallpaperQueue';
            let failures = [];
            for (const db of dbs) {
              try {
                const files = {};
                let first = null, totalSize = 0, landscape = null;   // v27.15 - landscape = 1:1 2000x2000 foldable companion
                for (const fr of item.frames) {
                  if (!fr.localPath) continue;                       // optional companion that was skipped
                  const buf = fs.readFileSync(fr.localPath);
                  const name = `${slug(item.concept)}_${fr.file}`;
                  const fileUrl = await uploadToR2(buf, name, db.name);   // R2 key = <db.name>/wallpaper/… — same account as the Firebase DB below
                  if (!new RegExp(`/${db.name.replace(/^zedge_?/i, 'zedge')}/wallpaper/`, 'i').test(fileUrl) && !/localhost|127\.0\.0\.1/.test(fileUrl)) throw new Error(`R2 returned a URL outside the ${db.name} folder (${fileUrl}) — aborted before writing Firebase`);
                  const entry = { fileUrl, name, size: buf.length, type: 'image/jpeg', width: fr.companion ? 2000 : w, height: fr.companion ? 2000 : h, sha256: sha256(buf) };
                  if (fr.companion) { landscape = entry; log(`🖼️ [${db.name}] R2 ← ${item.folder}/${fr.file} (1:1 2000×2000 foldable companion)`); continue; }
                  files[fr.slot] = entry; totalSize += buf.length;
                  if (!first) first = entry;
                  log(`☁️ [${db.name}] R2 ← ${item.folder}/${fr.file}`);
                }
                const base = {
                  name: first.name, type: 'image/jpeg', size: item.type === 'SINGLE' ? first.size : totalSize,
                  width: w, height: h, isMp3: false, isImage: true,
                  contentType: def.contentType,
                  fileUrl: first.fileUrl,
                  status: 'queued',
                  prompt: item.prompt,
                  imageModel: item.settings.model,
                  source: 'github-image-studio',
                  createdAt: Date.now()
                };
                // v27.15 - Zedge "Add landscape/foldable wallpaper": the bot, panel, app and desktop all read these two fields.
                if (landscape) { base.landscapeUrl = landscape.fileUrl; base.landscapeName = landscape.name; base.landscapeSize = '2000x2000'; }
                if (item.type !== 'SINGLE') { base.files = files; base.setName = item.concept; }
                // Ringtone-style: the record already carries title / tags / category / description / policyCheck,
                // so the Zedge bot can upload it immediately (no "metadata missing" skip). Policy-held items are
                // pushed as status:'failed' + policyCheck:'held' — visible in the app's Failed section, never auto-uploaded.
                const mf = metaFields(item);
                if (mf) Object.assign(base, mf);
                const key = await firebasePush(db.url, queuePath, base);
                for (const e of [...Object.values(files), ...(landscape ? [landscape] : [])]) ledger[e.sha256] = { account: db.name, firebaseKey: key, folder: item.folder, file: e.name, at: Date.now() };
                saveLedger();
                const snap = mf ? { title: base.title, tags: base.tags, category: base.category, description: base.description, policyCheck: base.policyCheck, policyFlag: base.policyFlag, status: base.status, metadataGeneratedAt: base.metadataGeneratedAt, fetchedAt: Date.now() } : {};
                item.distributed.push({ dbName: db.name, key, at: Date.now(), meta: snap });
                log(`🔥 [${db.name}] Firebase key ${key} ← ${item.folder} (${def.contentType})${mf ? ` · "${base.title}" · ${base.category} · policy ${base.policyCheck}${base.status !== 'queued' ? ` · status ${base.status}` : ''}` : ' · ⚠️ NO metadata (bot will skip until the final metadata pass)'}`);
                saveState();
              } catch (e) {
                failures.push(`${db.name}: ${e.message}`);
                log(`❌ [${db.name}] distribute ${item.folder}: ${e.message}`);
              }
            }
            item.distributeStatus = failures.length ? (item.distributed.length ? 'partial' : 'failed') : 'done';
            item.distributeError = failures.join(' · ');
            lastActivity = Date.now(); saveState();
            if (failures.length) throw new Error(failures.join(' · '));
          }
          function maybeAutoDistribute(item) {
            if (!state.settings.autoDistribute || item.status !== 'done' || item.distributed.length || item.distributeStatus === 'running') return;
            const hasMeta = !!(item.meta && item.meta.title);
            if (state.settings.requireMetadata && !hasMeta) {
              if (state.metaWorker.available && state.settings.autoMetadata) return;          // will be called again when the result lands
              log(`⏸ auto-distribute ${item.folder}: waiting for metadata (${state.metaWorker.available ? 'auto metadata is off — press 🧠' : 'GEMINI_SESSION missing — use Edit on the card'})`);
              return;
            }
            if (hasMeta && item.meta.policyCheck === 'held') { if (!item.autoHeldNoted) { item.autoHeldNoted = true; log(`🛑 auto-distribute skipped for ${item.folder}: Zedge policy hold — ${item.meta.policyFlag}. Review it, then Distribute manually (it will be pushed as status failed/held) or fix the metadata with Edit.`); } return; }
