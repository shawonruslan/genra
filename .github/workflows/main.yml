                let n = 0; for (const it of state.items) if (it.status === 'done' && !(it.meta && it.meta.title) && it.metaStatus !== 'queued' && it.metaStatus !== 'running') { clearTimeout(retryTimers.get(it.id)); retryTimers.delete(it.id); it.metaAttempts = 0; if (queueMetadata(it, 'panel')) n++; }
